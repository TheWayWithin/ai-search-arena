risks:
  - risk: "Perceived bias due to AI Search Mastery's market presence"
    severity: "High"
    mitigation: "Explicit firewall policy. AI Search Mastery products evaluated identically. Disclosed in every report."
  - risk: "Vendor pressure to influence scores or methodology"
    severity: "High"
    mitigation: "Published methodology locked per cycle. No pre-publication negotiation on scores. Correction process is post-publication and transparent."
  - risk: "Cadence failure (missing a monthly publication)"
    severity: "Medium"
    mitigation: "Build 2-week buffer into production schedule. Reduce scope before missing cadence. A smaller on-time report beats a comprehensive late one."
  - risk: "Methodology stagnation as market evolves"
    severity: "Medium"
    mitigation: "Annual methodology review with published changelog. Practitioner feedback loop. Advisory input from external reviewers."
  - risk: "Revenue pressure compromising independence"
    severity: "Medium"
    mitigation: "Revenue principles (Section 14) are structural constraints, not guidelines. Any monetization proposal is evaluated against independence criteria first."
  - risk: "Scope creep into consulting, strategy, or product"
    severity: "Low"
    mitigation: "'What AISearchArena Is Not' (Section 15) defines boundaries. Quarterly boundary review."

