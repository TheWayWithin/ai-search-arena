revenue_model:
  status: "intentionally undecided at launch"
  priority: "Establishing benchmark credibility"
  principles:
    - principle: "No pay-for-placement"
      detail: "Ever. This is the fastest way to destroy benchmark credibility and it is permanently off the table."
    - principle: "No vendor-funded evaluations"
      detail: "Tools are evaluated based on market relevance, not willingness to pay."
    - principle: "Revenue must be separable from editorial"
      detail: "Any monetization path must have a clear structural separation from the evaluation process. Readers must be able to verify that commercial relationships do not influence scores."
    - principle: "Multiple viable paths exist"
      detail: "Several models are compatible with these principles and remain under consideration."
    - principle: "Credibility is the asset"
      detail: "Any revenue model that degrades trust destroys more value than it captures. When in doubt, protect the benchmark's independence."
  viable_paths:
    - "Premium reports with deeper analysis (freemium model)"
    - "Syndicated data licensing to research firms or publications"
    - "Sponsored content clearly separated from benchmark editorial"
    - "Conference or event revenue leveraging benchmark authority"
    - "Consulting or advisory services based on benchmark expertise"
    - "Ecosystem value (benchmark drives authority and audience to AI Search Mastery products)"

what_it_is_not:
  - category: "Not a review site"
    explanation: "Reviews are subjective. Benchmarks are methodological. AISearchArena scores tools against defined criteria, not editorial opinion."
  - category: "Not a marketplace"
    explanation: "We do not sell the tools we evaluate. We do not earn affiliate revenue from tool purchases. (If this ever changes, it will be disclosed prominently.)"
  - category: "Not a marketing channel for AI Search Mastery"
    explanation: "The benchmark serves practitioners. If it also generates authority for the parent ecosystem, that is a beneficial side effect -- not the purpose."
  - category: "Not a one-time publication"
    explanation: "The value is in the cadence and the accumulating dataset. A single benchmark report is useful. Thirty-six consecutive monthly reports are a market record."
  - category: "Not comprehensive coverage of AI search"
    explanation: "AISearchArena evaluates tools. It does not teach AI search optimization strategy (that is AI Search Mastery's domain), provide consulting, or build custom solutions."

