      weight_name: "Medium"
      line_height: 1.0
      letter_spacing: "0.05em"
      text_transform: "uppercase"
      context: "Confidence tag badges"

    table_header:
      size_px: 14
      size_rem: "0.875rem"
      weight: 600
      weight_name: "SemiBold"
      line_height: 1.4
      letter_spacing: "0.02em"

    table_cell:
      size_px: 14
      size_rem: "0.875rem"
      weight: 400
      weight_name: "Regular"
      line_height: 1.5
      letter_spacing: "0"

    footnote:
      size_px: 13
      size_rem: "0.8125rem"
      weight: 400
      weight_name: "Regular"
      line_height: 1.5
      letter_spacing: "0"
      context: "Methodology references and footnotes"

    disclosure:
      size_px: 14
      size_rem: "0.875rem"
      weight: 400
      weight_name: "Regular"
      line_height: 1.6
      letter_spacing: "0"
