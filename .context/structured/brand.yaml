      line_height: 1.6
      letter_spacing: "0"

    score_display_large:
      size_px: 48
      size_rem: "3rem"
      weight: 700
      weight_name: "Bold"
      line_height: 1.0
      letter_spacing: "-0.02em"
      context: "Overall score display, most prominent typographic element"

    score_display_inline:
      size_px: 16
      size_rem: "1rem"
      weight: 600
      weight_name: "SemiBold"
      line_height: 1.0
      letter_spacing: "0"
      context: "Category scores inline"

    confidence_tag:
      size_px: 12
      size_rem: "0.75rem"
