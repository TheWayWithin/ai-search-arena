      name: "Inter"
      fallback: "system-ui, sans-serif"
      note: "No exceptions. Inherited from parent. No additional typefaces permitted."

  scale:
    h1_page_title:
      size_px: 36
      size_rem: "2.25rem"
      weight: 700
      weight_name: "Bold"
      line_height: 1.2
      letter_spacing: "-0.02em"
      context: "desktop"

    h2_section_heading:
      size_px: 28
      size_rem: "1.75rem"
      weight: 600
      weight_name: "SemiBold"
      line_height: 1.3
      letter_spacing: "-0.01em"
      context: "desktop"

    h3_category_heading:
      size_px: 22
      size_rem: "1.375rem"
      weight: 600
      weight_name: "SemiBold"
      line_height: 1.4
      letter_spacing: "0"
      context: "desktop"

    h4_tool_name:
      size_px: 18
      size_rem: "1.125rem"
      weight: 600
      weight_name: "SemiBold"
      line_height: 1.4
      letter_spacing: "0"
      context: "desktop"

    body:
      size_px: 16
      size_rem: "1rem"
