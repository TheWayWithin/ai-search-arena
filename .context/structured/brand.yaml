    sparkline_axis:
      size_px: 11
      size_rem: "0.6875rem"
      weight: 400
      weight_name: "Regular"
      color: "#9CA3AF"
      context: "Sparkline chart axis labels"

    category_badge_text:
      size_px: 12
      size_rem: "0.75rem"
      weight: 500
      weight_name: "Medium"
      text_transform: "uppercase"
      color: "#475569"
      context: "Category badge labels"

  weights:
    regular: 400
    medium: 500
    semibold: 600
    bold: 700

  principles:
    - "Scores are the most prominent typographic element on any benchmark page. 48px bold treatment ensures scores are scannable at a glance."
    - "Confidence tags use uppercase, letter-spaced small text to differentiate them from score values."
    - "Methodology references and footnotes are visually subordinate but never hidden. Smaller size does not mean buried."
    - "Disclosure text is set at body-adjacent size (14px) to ensure readability. It is not fine print."

