meta:
  document_type: "Brand Extension Framework"
  version: "1.0"
  created: "2026-02-23"
  owner: "@brand-strategy"
  parent_brand: "AI Search Mastery"
  status: "Active"
  review_cadence: "Annually, or when brand architecture changes"
  dependencies:
    - "vision-mission.md (v1.0)"
    - "positioning-statement.md (v1.0)"
  purpose: >
    Governs how the AISearchArena sub-brand extends from the AI Search Mastery parent brand.
    Defines what is inherited, what diverges, and why. Addresses the central tension: AISearchArena
    is part of a branded house whose other properties include products that compete in the market
    the benchmark evaluates.

brand_architecture:
  model: "Branded House"
  parent:
    name: "AI Search Mastery"
    role: "Parent Hub"
    values:
      - "Clarity Over Cleverness"
      - "Honesty Over Hype"
      - "Action Over Analysis"
      - "Accessibility Is The Mission"
      - "Build To Evolve"
    archetype: "The Guide"
    brand_essence: "Clarity"
  sub_properties:
    - name: "aisearchmastery.com"
      role: "Knowledge and strategy hub"
      accent_color: "#2563EB"
      accent_name: "Signal Blue"
    - name: "aimpactscanner.com"
      role: "Diagnostic tool (product)"
      accent_color: "#0D9488"
      accent_name: "Clarity Teal"
    - name: "llmtxtmastery.com"
      role: "Optimization tool (product)"
      accent_color: "#D97706"
      accent_name: "Action Amber"
    - name: "aisearcharena.com"
      role: "Independent benchmark"
      accent_color: "#475569"
      accent_name: "Arena Slate"

  aisearcharena:
    brand_essence: "Rigor"
    archetype: "The Evaluator"
    archetype_description: "A Guide who helps through structured measurement rather than instruction"
    tone_emphasis: "Data-driven, methodology-forward"
    content_format: "Benchmark reports, tool profiles, methodology documentation, trend analyses"
    commercial_posture: "Evaluates market; does not promote"
    disclosure_requirement: "Prominent conflict of interest disclosure on every report and page"

    inherited_from_parent:
      - element: "Typography"
        standard: "Inter (exclusively), modular scale"
        application: "Identical. No additional typefaces"
      - element: "Primary colour palette"
        standard: "Mastery Blue #1E3A5F as anchor colour"
        application: "Used in shared navigation, footer, and parent attribution"
      - element: "Values framework"
        standard: "5 parent values"
        application: "Inherited as foundation. Extended with 5 benchmark-specific values"
      - element: "Brand archetype"
        standard: "The Guide"
        application: "Expressed as The Evaluator"
      - element: "Voice principles"
        standard: "Plain language, practitioner-grounded, honest about limitations"
        application: "Adapted for data-forward benchmark context"
      - element: "Footer attribution"
        standard: "Part of AI Search Mastery"
        application: "Applied consistently on every page"
      - element: "Card-based layout patterns"
        standard: "Consistent card styling across properties"
        application: "Used for tool profiles and category displays"
      - element: "CTA standards"
        standard: "Action-oriented, benefit-clear"
        application: "Benchmark-specific actions (View Methodology, Compare Tools)"

    divergences:
      - element: "Brand essence"
        parent: "Clarity"
        arena: "Rigor"
        rationale: "Benchmark credibility demands a distinct quality. Rigor is the mechanism that produces clarity in a comparative evaluation context"
      - element: "Accent colour"
        parent: "Signal Blue #2563EB"
        arena: "Arena Slate #475569"
        rationale: "Neutral, authoritative tone suited to evaluation. Deliberately avoids the energy/warmth of product sub-brands"
      - element: "Tone emphasis"
        parent: "Educational, encouraging"
        arena: "Data-driven, methodology-forward"
        rationale: "The benchmark teaches through evidence, not instruction"
      - element: "Content format"
        parent: "Articles, guides, tutorials"
        arena: "Benchmark reports, tool profiles, methodology documentation, trend analyses"
        rationale: "Structured data output rather than editorial content"
      - element: "Commercial posture"
        parent: "Promotes ecosystem products"
        arena: "Evaluates market; does not promote"
        rationale: "Editorial independence is a structural requirement"
      - element: "Disclosure requirements"
        parent: "Standard business disclosures"
        arena: "Prominent conflict of interest disclosure on every report and page"
        rationale: "The benchmark evaluates a market that includes parent brand products"

    independence_belonging_tension:
      description: "AISearchArena must simultaneously signal belonging to AI Search Mastery and editorial independence from AI Search Mastery's commercial interests"
      mechanisms:
        visual: "Arena Slate accent colour is deliberately cooler and more neutral than the warmer product-brand accents. Signals analytical distance without breaking from the visual system."
        verbal: "Benchmark content uses data-forward language and does not include cross-promotional language for parent brand products."
        structural: "Conflict of interest disclosure appears prominently. Methodology is published and locked per cycle. Vendor disclosure process applies equally to parent brand products."
      goal: "Not to hide the relationship. To demonstrate that the relationship does not compromise the evaluation."

colors:
  primary:
    arena_slate:
      hex: "#475569"
      name: "Arena Slate"
      usage: "Headers, primary CTAs, navigation accents, benchmark branding, dominant accent on all AISearchArena pages"
    arena_slate_light:
      hex: "#64748B"
      name: "Arena Slate Light"
      usage: "Secondary text, supporting UI elements, section dividers, wordmark 'Search' portion"
    arena_slate_pale:
      hex: "#CBD5E1"
      name: "Arena Slate Pale"
      usage: "Backgrounds, card borders, inactive states, category badge backgrounds"

  secondary:
    mastery_blue:
      hex: "#1E3A5F"
      name: "Mastery Blue"
      usage: "Footer, parent attribution bar, shared navigation elements, email footer attribution. Parent anchor colour only."

  accent:
    signal_blue:
      hex: "#2563EB"
      name: "Signal Blue"
      property: "aisearchmastery.com"
      usage_on_arena: "PROHIBITED - reserved for parent hub sub-brand"
    clarity_teal:
      hex: "#0D9488"
      name: "Clarity Teal"
      property: "aimpactscanner.com"
      usage_on_arena: "PROHIBITED - reserved for diagnostic tool sub-brand"
    action_amber:
      hex: "#D97706"
      name: "Action Amber"
      property: "llmtxtmastery.com"
      usage_on_arena: "PROHIBITED - reserved for optimization tool sub-brand"

  functional:
    confidence_green:
      hex: "#059669"
      name: "Confidence Green"
      usage: "High confidence scores, positive trend indicators, improvement arrows"
    caution_amber:
      hex: "#D97706"
      name: "Caution Amber"
      usage: "Medium confidence scores, caution indicators. Functional context only, never as brand accent. Context (confidence tags, trend arrows) prevents association with LLM.txt Mastery sub-brand."
      note: "Shares hex value with Action Amber. On AISearchArena appears ONLY in functional confidence/trend contexts."
    insufficient_red:
      hex: "#DC2626"
      name: "Insufficient Red"
      usage: "Low confidence, insufficient data indicators, decline trends, decline arrows"
    neutral_grey:
      hex: "#9CA3AF"
      name: "Neutral Grey"
      usage: "Baseline states, no-change indicators, disabled elements, parent attribution text, sparkline axis labels"

  neutrals:
    white:
      hex: "#FFFFFF"
      usage: "Table row backgrounds (odd rows), badge backgrounds, icon backgrounds"
    pale_grey:
      hex: "#F8FAFC"
      usage: "Alternating table row backgrounds (even rows)"
    dark_grey:
      hex: "#4B5563"
      usage: "Insufficient data badge text colour"
    dark_amber:
      hex: "#92400E"
      usage: "Medium confidence badge text colour"
    dark_red:
      hex: "#991B1B"
      usage: "Low confidence badge text colour"

    tailwind_slate_scale:
      50: "#F8FAFC"
      100: "#F1F5F9"
      200: "#E2E8F0"
      300: "#CBD5E1"
      400: "#94A3B8"
      500: "#64748B"
      600: "#475569"
      700: "#334155"
      800: "#1E293B"
      900: "#0F172A"
      950: "#020617"

  usage_rules:
    - "Arena Slate is the dominant accent on all AISearchArena pages"
    - "Mastery Blue appears only in parent attribution areas (footer, shared navigation bar)"
    - "Signal Blue, Clarity Teal, and Action Amber DO NOT appear on AISearchArena pages - reserved for their respective sub-brands"
    - "Confidence Green, Caution Amber, and Insufficient Red are functional colours used exclusively for score confidence indicators and trend displays - not for decorative purposes"
    - "Caution Amber shares hex with Action Amber (#D97706) - on AISearchArena appears only in functional confidence/trend contexts, never as brand accent"
    - "Charts use Arena Slate line/bar colours with functional colours only for confidence/trend"

typography:
