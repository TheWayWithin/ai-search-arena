  md: "0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -2px rgba(0, 0, 0, 0.1)"
  lg: "0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -4px rgba(0, 0, 0, 0.1)"
  xl: "0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.1)"
  2xl: "0 25px 50px -12px rgba(0, 0, 0, 0.25)"
  inner: "inset 0 2px 4px 0 rgba(0, 0, 0, 0.05)"
  none: "0 0 #0000"
  note: "Tailwind defaults. Source document does not specify custom shadows."

animations:
  transition_property:
    none: "none"
    all: "all"
    DEFAULT: "color, background-color, border-color, text-decoration-color, fill, stroke, opacity, box-shadow, transform, filter, backdrop-filter"
    colors: "color, background-color, border-color, text-decoration-color, fill, stroke"
    opacity: "opacity"
    shadow: "box-shadow"
    transform: "transform"
  transition_timing_function:
    DEFAULT: "cubic-bezier(0.4, 0, 0.2, 1)"
    linear: "linear"
    in: "cubic-bezier(0.4, 0, 1, 1)"
    out: "cubic-bezier(0, 0, 0.2, 1)"
    in_out: "cubic-bezier(0.4, 0, 0.2, 1)"
  transition_duration:
    75: "75ms"
    100: "100ms"
    150: "150ms"
    200: "200ms"
    300: "300ms"
    500: "500ms"
    700: "700ms"
    1000: "1000ms"
  note: "Tailwind defaults. Source document does not specify custom animations. Brand tone (analytical, serious) suggests restrained animation use."

breakpoints:
  sm: "640px"
  md: "768px"
  lg: "1024px"
  xl: "1280px"
  2xl: "1536px"
  note: "Tailwind defaults. Source document specifies mobile-first responsive tables with horizontal scroll and sticky first column."

