components:
  buttons:
    primary_cta:
      background: "#475569"
      text_color: "#FFFFFF"
      font: "Inter"
      font_weight: 600
      style: "Action-oriented, benefit-clear"
      examples:
        - "View Methodology"
        - "Compare Tools"
        - "View Full Benchmark Report"
        - "View Full Report"
    states:
      default:
        background: "#475569"
        text: "#FFFFFF"
      hover:
        note: "Use Tailwind default hover behavior"
      disabled:
        note: "Use Neutral Grey #9CA3AF"

  cards:
    tool_profile_card:
      layout: "Card-based layout inherited from parent"
      usage: "Tool profiles and category displays"
      border: "Arena Slate Pale #CBD5E1"
    disclosure_block:
      border_left: "3px solid #475569"
      inset: "Slightly inset from content margin"
      note: "Visible but not alarming. Signals transparency as a feature, not a warning."

  inputs:
    sort_controls:
      available_on: "All numeric columns in comparison tables"
      style: "Touch-friendly for mobile"

  badges:
    confidence_tags:
      shape: "pill (border-radius: 9999px)"
      font: "Inter Medium 12px"
      letter_spacing: "0.05em"
      text_transform: "uppercase"
      padding_vertical: "4px"
      padding_horizontal: "10px"
      inline_format:
        - "[HIGH]"
        - "[MED]"
        - "[LOW]"
        - "[INSUF]"
      levels:
        high:
          background: "rgba(5, 150, 105, 0.1)"
          text_color: "#059669"
          border: "1px solid rgba(5, 150, 105, 0.3)"
        medium:
          background: "rgba(217, 119, 6, 0.1)"
          text_color: "#92400E"
          border: "1px solid rgba(217, 119, 6, 0.3)"
        low:
          background: "rgba(220, 38, 38, 0.1)"
          text_color: "#991B1B"
          border: "1px solid rgba(220, 38, 38, 0.3)"
        insufficient_data:
          background: "rgba(156, 163, 175, 0.1)"
          text_color: "#4B5563"
          border: "1px solid rgba(156, 163, 175, 0.3)"

    category_badges:
      shape: "rounded rectangle"
      border_radius: "6px"
      background: "#CBD5E1"
      text_color: "#475569"
      font: "Inter Medium 12px"
      text_transform: "uppercase"
      padding_vertical: "3px"
      padding_horizontal: "8px"
      usage: "Tool profiles, comparison tables, benchmark reports to label which category a score applies to"
      color_rule: "NO colour-coding per category. All categories use the same Arena Slate palette. Colour is reserved for confidence and trend indicators."

    evaluated_badge:
      type: "Evaluated"
      availability: "Any tool evaluated in at least one benchmark cycle"
      border_color: "#475569"
      text_color: "#475569"
      background: "#FFFFFF"
      displays_score: false
      content:
        - "AISearchArena"
        - "EVALUATED"
        - "[Month] [Year]"
        - "aisearcharena.com"
      link: "Tool profile page on aisearcharena.com"

    score_badge:
      type: "Score"
      availability: "Any tool with overall score and High or Medium confidence"
      border_color: "#475569"
      text_color: "#475569"
      background: "#FFFFFF"
      confidence_badge: "Uses standard confidence colour system"
      displays_score: true
      content:
        - "AISearchArena"
        - "Score: [X.X]  Confidence: [LEVEL]"
        - "[Month] [Year] Benchmark"
        - "aisearcharena.com/tools/[slug]"
      link: "Tool profile page for that evaluation period"

    category_badge_vendor:
      type: "Category"
      availability: "Tools scoring top 3 in a category with HIGH confidence only"
      visual_treatment: "Same as Score Badge"
      content:
        - "AISearchArena"
        - "Top 3: [Category Name]"
        - "Score: [X.X]  Confidence: HIGH"
        - "[Month] [Year]"
        - "aisearcharena.com/tools/[slug]"

    badge_provisioning:
      formats:
        - type: "SVG"
          note: "Scalable, recommended"
        - type: "PNG"
          sizes:
            - "200px wide"
            - "300px wide"
            - "400px wide"
      embed_code: "HTML with proper link attribution provided alongside badge files"
      auto_update: "Badge files updated automatically when new benchmark data publishes"

    badge_usage_rules:
      - "Badges must link to the source evaluation"
      - "Badges must display the evaluation month and year"
      - "Badges must not be modified (resize proportionally OK, no crop)"
      - "Confidence level must be displayed on Score and Category badges"
      - "Outdated badges must be updated or removed within 60 days of new cycle"
      - "Selective display permitted with limitations"
      - "Score badges not available for Low confidence or Insufficient Data"
      - "AI Search Mastery products follow identical badge rules"

  score_display:
    overall:
      container_border: "2px solid #475569"
      score_font_size: "48px"
      score_font_family: "Inter"
      score_font_weight: 700
      confidence_tag_position: "Right of score"
      confidence_tag_style: "pill-shaped badge"
    category_scores:
      layout: "Dot-leader pattern for scanability"
      inline_confidence: "Abbreviated format [HIGH] [MED] [LOW] [INSUF]"
    sparkline:
      line_color: "#475569"
      fill: "rgba(71, 85, 105, 0.05)"
      data_point_dots: "4px diameter"
      data_point_color: "#475569"
      axis_labels_font: "Inter Regular 11px"
      axis_labels_color: "#9CA3AF"
      minimum_data_points: 3
      fallback_message: "Trend data available after 3 months"

  comparison_table:
    header_row:
      background: "#475569"
      text_color: "#FFFFFF"
      font: "Inter SemiBold 14px"
    alternating_rows:
      odd: "#FFFFFF"
      even: "#F8FAFC"
    score_cells:
      alignment: "right-aligned (numerically aligned)"
      font: "Inter SemiBold"
    tool_name_column:
      alignment: "left-aligned"
      font: "Inter SemiBold"
      link: "Links to tool profile"
    category_column:
      alignment: "left-aligned"
      font: "Inter Regular"
      includes: "Category badge"
    trend_indicator:
      type: "Small arrow icon (up/down/neutral)"
      position: "Next to score"
      coloured_by: "direction"
    sort_controls: "Available on all numeric columns"
    responsive:
      behavior: "Tables scroll horizontally on mobile"
      sticky_column: "First column (tool name)"

  trend_indicators:
    improvement:
      symbol: "Arrow up (chevron)"
      color: "#059669"
      usage: "Score increased from previous month"
    decline:
      symbol: "Arrow down (chevron)"
      color: "#DC2626"
      usage: "Score decreased from previous month"
    no_change:
      symbol: "Horizontal dash"
      color: "#9CA3AF"
      usage: "Score unchanged from previous month"
    new_entry:
      symbol: "Dot / bullet"
      color: "#475569"
      usage: "First month of evaluation"
    insufficient_data:
      symbol: "Em dash (--)"
      color: "#9CA3AF"
      usage: "Could not score in this period"
    note: "Reference immediately preceding month only. Longer-term trends displayed through sparkline charts."

  navigation:
    primary:
      position: "Persistent across all pages"
      items:
        - label: "Benchmark"
          link: "Most recent report"
        - label: "Tools"
          link: "Tool directory"
        - label: "Categories"
          link: "Category overview"
        - label: "Methodology"
          link: "/methodology"
          note: "Primary nav, not footer. Intentional trust signal."
        - label: "Disclosure"
          link: "/disclosure"
          note: "Primary nav, not footer. Intentional trust signal."
      rules:
        - "No links to other AI Search Mastery product properties in navigation"
    secondary:
      position: "Footer"
      items:
        - label: "About"
          link: "/about"
        - label: "Press"
          link: "/press"
        - label: "Trends"
          link: "/trends"
        - label: "Contact"
          link: "/about"
        - label: "Part of AI Search Mastery"
          link: "https://aisearchmastery.com"
          note: "Only navigation element connecting to parent brand"

shadows:
