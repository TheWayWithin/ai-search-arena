    principles:
      - "Clarity Over Cleverness"
      - "Honesty Over Hype"
      - "Action Over Analysis"
      - "Accessibility Is The Mission"
      - "Build To Evolve"

  arena_characteristics:
    archetype: "The Evaluator"
    archetype_description: "Measures, reports, lets data guide decisions"
    tone: "Measured, precise, data-forward, still practitioner-first"
