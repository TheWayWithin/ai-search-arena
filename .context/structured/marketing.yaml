channels:
  primary:
    - id: "website"
      name: "AISearchArena.com"
      role: "The authoritative source for all benchmark data, methodology, and analysis. All other channels drive traffic here."
      site_architecture:
        - path: "/methodology"
          description: "Full methodology documentation"
        - path: "/disclosure"
          description: "Conflict of interest disclosure"
        - path: "/about"
          description: "About AISearchArena"
        - path: "/how-we-score"
          description: "Accessible scoring guide"
        - path: "/benchmark/"
          description: "Monthly benchmark reports"
          example: "/benchmark/2026-03 -- March 2026 benchmark"
        - path: "/tools/"
          description: "Individual tool profiles"
          example: "/tools/[tool-slug] -- One page per evaluated tool"
        - path: "/categories/"
          description: "Category analysis pages"
          example: "/categories/[cat-slug] -- One page per scoring category"
        - path: "/segments/"
          description: "Market segment pages"
          example: "/segments/[seg-slug] -- One page per market segment"
        - path: "/analysis/"
          description: "Category deep-dives, trend reports, analysis pieces"
        - path: "/changelog"
          description: "Methodology version history"
        - path: "/vendors"
          description: "Vendor participation guide and disclosure template"
        - path: "/press"
          description: "Press/media kit"
        - path: "/newsletter"
          description: "Email signup and archive"
        - path: "/blog"
          description: "Editorial posts (methodology education, market commentary)"
      content_types:
        - section: "Benchmark reports"
          type: "Monthly reports with full data"
          update_frequency: "Monthly"
        - section: "Tool profiles"
          type: "Individual tool evaluations and historical data"
          update_frequency: "Monthly"
        - section: "Category pages"
          type: "Category-level analysis"
          update_frequency: "Monthly (data), periodic (deep-dives)"
        - section: "Segment pages"
          type: "Market segment analysis"
          update_frequency: "Monthly (data), periodic (spotlights)"
        - section: "Analysis"
          type: "Deep-dives, trends, comparisons"
          update_frequency: "2-4 per month"
        - section: "Blog"
          type: "Methodology education, market commentary, meta-content"
          update_frequency: "2-4 per month"
        - section: "Methodology"
          type: "Full methodology documentation"
          update_frequency: "Updated when methodology changes"
        - section: "Changelog"
          type: "Methodology version history"
          update_frequency: "Updated when methodology changes"

    - id: "email_newsletter"
      name: "Email Newsletter"
      role: "Retention and re-engagement. Bring subscribers back for each monthly benchmark and sustain engagement between publications."
      subscriber_acquisition:
        - "Email signup on every page (non-intrusive, clear value proposition: 'Monthly benchmark data delivered to your inbox')"
        - "Launch landing page with signup as primary CTA"
        - "Community posts and social media include signup link"
        - "No email gating of benchmark data. The report is free. The newsletter adds delivery convenience and exclusive analysis"
        - "Separate list from AI Search Mastery. No list sharing without explicit double opt-in"
      content_cadence:
        - email: "Monthly Benchmark Report"
          timing: "Week 4, publication day"
          content: "Executive summary, key findings, data visualizations, link to full report"
        - email: "Mid-Month Analysis"
          timing: "Week 2 (between benchmarks)"
          content: "Category deep-dive or trend analysis. Substantive content, not filler"
        - email: "Methodology Update (as needed)"
          timing: "When methodology changes"
          content: "What changed, why, impact on scores"
        - email: "Quarterly Market Overview"
          timing: "End of quarter"
          content: "3-month trend summary, market-level insights, data highlights"
      segmentation:
        trigger: "Implement when subscriber base reaches 500+"
        segments:
          - "By practitioner type (consultant/agency, in-house marketer, solopreneur)"
          - "By interest area (specific categories, specific market segments)"
          - "By engagement level (active readers, lapsed subscribers)"
      metrics:
        open_rate_target: "35%+ (niche, high-value content should perform well above industry average)"
        click_through_rate_target: "15%+"
        unsubscribe_rate_max: "below 1% per send"

  secondary:
    - id: "twitter_x"
      name: "Twitter/X"
      role: "Real-time engagement, data sharing, industry conversation, discovery."
      account: "@AISearchArena (or closest available handle)"
      content_cadence:
        - type: "Benchmark launch announcement"
          frequency: "Monthly"
          format: "Thread: key findings, data visualizations, link to report"
        - type: "Individual data points"
          frequency: "3-5x per week during publication week"
          format: "Single tweet with one finding, one visualization"
        - type: "Category highlights"
          frequency: "2-3x per month"
          format: "Single tweet or short thread with category-specific insight"
        - type: "Methodology notes"
          frequency: "As relevant"
          format: "Tweet explaining a methodology choice or responding to a question"
        - type: "Industry commentary"
          frequency: "1-2x per week"
          format: "Commenting on GEO/AEO market developments through the lens of benchmark data"
        - type: "Engagement with mentions"
          frequency: "Ongoing"
          format: "Reply to questions, mentions, discussions about the benchmark"
      launch_thread_strategy:
        - "Tweet 1: The headline finding. One clear, specific, data-backed claim. Link to full report."
        - "Tweets 2-5: Supporting findings. One per tweet. Each includes a data visualization."
        - "Tweet 6: Methodology reminder. 'How we reached these conclusions' with link to methodology page."
        - "Tweet 7: Disclosure. Brief statement of the conflict of interest with link to disclosure page."
        - "Tweet 8: Call to action. What practitioners should do with this data."
      engagement_approach:
        - "Respond to substantive questions within 24 hours"
        - "Engage with criticism constructively. If someone challenges the methodology or the conflict, respond with substance, not defensiveness"
        - "Do not engage in vendor disputes on Twitter. Direct to the vendor disclosure and correction process"
        - "Retweet/amplify practitioners and media citing the benchmark data (this encourages future citations)"
        - "Do not use promotional language. Share data and analysis; let practitioners draw their own conclusions"

    - id: "linkedin"
      name: "LinkedIn"
      role: "Professional positioning, practitioner reach, vendor engagement."
      content_cadence:
        - type: "Benchmark summary post"
          frequency: "Monthly"
          format: "Long-form post with key findings, 1-2 data visualizations, link to report"
        - type: "Category analysis"
          frequency: "1-2x per month"
          format: "Article or long-form post on category trends"
        - type: "Methodology education"
          frequency: "1x per month"
          format: "Post explaining an aspect of the benchmark methodology"
        - type: "Market commentary"
          frequency: "1-2x per month"
          format: "Observations on the GEO/AEO market grounded in benchmark data"
      considerations:
        - "LinkedIn audience skews toward decision-makers and vendors. Content should be substantive and professional"
        - "Avoid engagement-bait formatting (polls about opinions, 'agree?' posts, emoji-heavy formatting)"
        - "Lead with data and insight, not self-promotion"
        - "Use LinkedIn articles for longer category analysis pieces (cross-posted from AISearchArena.com blog, with canonical link)"
        - "Engage in comments substantively. This is where vendor dialogue often happens"

    - id: "youtube"
      name: "YouTube"
      role: "Benchmark breakdowns and methodology education for practitioners who prefer video."
      launch_timeline: "Consider launching 3-6 months after initial benchmark (Month 4-7), once the benchmark has established credibility and there is enough data for meaningful video content."
      content_types:
        - type: "Monthly benchmark breakdown"
          frequency: "Monthly"
          format: "10-15 minute video walking through key findings with screen-shared data"
        - type: "Category deep-dive"
          frequency: "1x per month"
          format: "8-12 minute video analyzing a specific category in detail"
        - type: "Methodology explainer"
          frequency: "As needed"
          format: "5-8 minute video explaining specific methodology concepts"
        - type: "Quarterly market overview"
          frequency: "Quarterly"
          format: "15-20 minute comprehensive market analysis"
      considerations:
        - "Video is resource-intensive. Do not launch until the monthly written benchmark cycle is running smoothly"
        - "Videos should add perspective and walkthrough value, not just repeat written content"
        - "Include the Disclosure Statement in every video (brief verbal mention with on-screen text and link)"
        - "Optimize for search: title with tool names, description with keywords, timestamps for sections"

    - id: "seo_community_channels"
      name: "SEO and AI Search Community Channels"
      target_channels:
        - channel: "r/SEO and r/bigseo"
          approach: "Share monthly benchmark data as useful resource. Participate in tool selection discussions. Respond when asked about GEO/AEO tools"
          cadence: "Monthly at launch, then as discussions arise"
        - channel: "SEO-focused Slack groups (Traffic Think Tank, Superpath, etc.)"
          approach: "Share methodology and findings. Respond to tool questions with data"
          cadence: "Monthly at launch, then conversational"
        - channel: "Search Engine Journal, Search Engine Land communities"
          approach: "Pitch data-driven guest posts using benchmark findings"
          cadence: "Quarterly pitches"
        - channel: "GEO/AEO-specific Discord servers and communities"
          approach: "Active participation as a benchmark operator and practitioner"
          cadence: "Weekly presence"
        - channel: "Hacker News"
          approach: "Submit methodology posts and significant findings. HN values rigor and transparency"
          cadence: "When content is genuinely novel or technically interesting"
      engagement_rules:
        - "Always disclose affiliation"
        - "Add value before introducing the benchmark"
        - "Lead with data and methodology, not self-promotion"
        - "Accept and engage with skepticism constructively"
        - "Respect community norms"

    - id: "asm_cross_promotion"
      name: "AI Search Mastery Cross-Promotion (Ongoing)"
      guidelines: "Arm's-length guidelines established in Section 2.3"
      permitted:
        - "Contextual references to AISearchArena when discussing tool selection on AI Search Mastery ('for structured comparison data, see AISearchArena')"
        - "Quarterly mention in AI Search Mastery newsletter ('the latest benchmark is available at AISearchArena.com')"
        - "Linking to AISearchArena methodology when discussing evaluation rigor in AI Search Mastery content"
      not_permitted:
        - "Using benchmark scores to promote AI Search Mastery products"
        - "Republishing benchmark data on AI Search Mastery properties"
        - "Persistent promotional pushes in AI Search Mastery content or email"
        - "Treating AISearchArena content as a lead generation tool for AI Search Mastery products"

distribution_strategy:
  monthly_benchmark_cycle:
    week_1:
      activity: "Evaluation execution"
      output: "Raw evaluation data and evidence documentation"
      details: "Run benchmark methodology against all tools. Collect data from 6 independent analyses. Compile evidence artifacts"
    week_2:
      activity: "Score synthesis and report drafting"
      output: "Draft benchmark report, draft tool profiles, draft data visualizations"
      details: "Combine multi-source analyses. Apply confidence tags. Draft benchmark report, category summaries, tool profiles"
    week_3:
      activity: "Vendor pre-publication review"
      output: "Final benchmark report locked for publication"
      details: "Send vendor notifications (Monday). Process vendor responses (through Thursday). Finalize scores (Friday). Final editorial review"
    week_4:
      activity: "Publication and amplification"
      output: "Published benchmark, supporting content, amplification, audience feedback"
      details: "Publish benchmark (Tuesday). Distribute via email, social, communities. Publish supporting content (category deep-dives, analysis posts). Collect feedback"

  data_visualizations:
    monthly_assets:
      - asset: "Overall ranking chart (both tracks)"
        format: "PNG, SVG"
        purpose: "Social sharing, media citation"
      - asset: "Category comparison matrix"
        format: "PNG, SVG"
        purpose: "Practitioners comparing tools across categories"
      - asset: "Score movement chart"
        format: "PNG, SVG"
        purpose: "Month-over-month changes (from Month 2)"
      - asset: "Market segment map"
        format: "PNG, SVG"
        purpose: "Visual overview of the competitive landscape"
      - asset: "Individual tool score cards"
        format: "PNG"
        purpose: "Social sharing, vendor sharing"
      - asset: "'What Changed' summary graphic"
        format: "PNG"
        purpose: "Newsletter header, social media"
    design_standards:
      - "All visualizations carry AISearchArena branding and the source URL"
      - "Designed for social media dimensions (1200x675 for Twitter/X, 1200x1200 for LinkedIn/Instagram)"
      - "Readable at thumbnail size"
      - "Include data date ('March 2026 Benchmark Data')"
      - "Include attribution line ('Source: AISearchArena.com')"
      - "Licensed for reuse with attribution (Creative Commons BY or similar)"

  methodology_updates:
    policy: "Methodology changes are a content event, not a footnote."
    when_methodology_changes:
      - "Publish a dedicated methodology update post explaining what changed, why, and how it affects historical comparisons"
      - "Update the methodology page with new version number"
      - "Maintain a methodology changelog page (versioned history)"
      - "Notify email subscribers of methodology changes"
      - "Notify vendors of methodology changes that affect their evaluation"
    cadence: "Methodology review quarterly. Changes published immediately when implemented. Major revisions (new categories, weighting changes) get dedicated announcement posts."

messaging_framework:
  vocabulary_compliance:
    enforcement:
      - "Every content creator receives the 'What We Say / What We Don't Say' vocabulary guide from the Positioning Statement before producing content"
      - "Vocabulary compliance is a required checklist item in the review workflow"
      - "Quarterly vocabulary audit of all published content to identify drift"
      - "New terms or vocabulary questions are resolved by the editorial lead with reference to the Positioning Statement"
    key_reminders:
      use:
        - "'Benchmark' not 'review site'"
        - "'Evaluation' not 'rating' or 'review'"
        - "'Conflict of interest' (not 'potential' or 'perceived')"
      never_use:
        - "'unbiased' or 'objective'"
        - "'the best' or 'the definitive'"
        - "'winner' / 'loser' -- use 'top-performing in [category]' or 'scored below category average'"
        - "'recommended' / 'our pick' -- provide data, not recommendations"
        - "'game-changing' / 'revolutionary' / 'disrupting'"

  quality_standards:
    - standard: "Factual accuracy"
      requirement: "All data points traceable to benchmark evidence. No unsupported claims"
    - standard: "Vocabulary compliance"
      requirement: "Adheres to 'What We Say / What We Don't Say' vocabulary guidance from the Positioning Statement"
    - standard: "Disclosure presence"
      requirement: "Conflict of interest disclosure present wherever benchmark data or tool evaluations appear"
    - standard: "Practitioner accessibility"
      requirement: "A marketing professional with 3 years of experience can understand the content (per Positioning Statement tone principles)"
    - standard: "Methodology traceability"
      requirement: "Every score or claim links to or references the methodology that produced it"
    - standard: "Confidence honesty"
      requirement: "Where data confidence is limited, that limitation is stated. 'We don't know yet' is an acceptable content conclusion"
    - standard: "No promotional language"
      requirement: "Content informs and analyzes. It does not sell, hype, or advocate for specific tools"
    - standard: "Attribution"
      requirement: "External data sources cited. Other publications credited"

vendor_engagement_protocol:
  pre_publication_notification:
    timing: "5 business days before publication"
    process:
      - "Each vendor receives their own scores only (not competitor scores)"
      - "Scores are presented with methodology reference and evidence summary"
      - "Vendors have 3 business days to submit factual corrections"
      - "Factual corrections are changes to verifiable facts ('our tool does support X, here is the documentation'), not disagreements with methodology or scoring judgment"
      - "Vendor responses are documented. Corrections accepted are noted in the benchmark as 'corrected per vendor disclosure'"

  right_of_reply:
    - "Vendors can submit a response of up to 500 words that is published alongside their tool profile, unedited"
    - "Responses are clearly labeled as 'Vendor Response' and separated from editorial content"
    - "The right of reply is available to every vendor, including AI Search Mastery products (though AI Search Mastery products will not exercise it to avoid the appearance of self-advocacy within the benchmark)"

  post_publication_corrections:
    - "Vendors can submit corrections after publication"
    - "Corrections are evaluated by the editorial team"
    - "Accepted corrections result in a published correction notice with the same prominence as the original score"
    - "Correction history is maintained and visible"

  tool_profiles:
    structure:
      - "Tool name, vendor, market segment classification"
      - "Current month scores across all applicable categories with confidence tags"
      - "Historical score chart (populated from Month 2 onward -- this becomes the longitudinal value)"
      - "Strengths and limitations summary (updated monthly)"
      - "Vendor disclosure status and date"
      - "Vendor response (if submitted)"
      - "Pricing information (where available)"
      - "'Best for' use case guidance"
      - "Related tools in the same market segment (comparison links)"
    update_cadence: "Monthly, synchronized with benchmark publication"

content_production:
  monthly_benchmark_report_structure:
    - section: "Executive Summary"
      word_count: 500
      content: "Top findings, significant score changes, new tools added/removed, methodology changes"
    - section: "What Changed This Month"
      content: "Score movements, new entrants, category shifts, methodology updates, vendor engagement updates"
    - section: "Overall Rankings (by track)"
      content: "GEO Platform Track and llms.txt Tooling Track ranked by composite score with confidence tags. Visual: ranking chart, score distribution, movement indicators"
    - section: "Category Results (7 sections)"
      content: "Category-by-category rankings with scores and confidence tags. Notable patterns, gaps, standout performers. Month-over-month trends (starting Month 2)"
    - section: "Market Segment Analysis (7 segments)"
      content: "Performance within each market segment. Segment-level trends and observations"
    - section: "Individual Tool Profiles"
      content: "Updated scores for all evaluated tools. Significant changes highlighted. Link to full individual profile pages (linked, not inline for reports after Month 1)"
    - section: "Methodology Notes"
      content: "Any methodology adjustments for this cycle. Confidence level commentary. Plans for methodology refinement"
    - section: "The Disclosure Statement"
      content: "Every report, every month"
  distribution:
    - "Published on AISearchArena.com as primary location"
    - "Email newsletter with executive summary and link to full report"
    - "Social media with key findings and visualizations"
    - "Press notification for media contacts"

  launch_day_content_package:
    - name: "The March 2026 Benchmark Report (primary)"
      components:
        - "Executive summary: key findings in 500 words"
        - "Overall rankings by benchmark track (GEO Platform Track, llms.txt Tooling Track)"
        - "Category-by-category results with confidence tags"
        - "Individual tool profiles (one section per tool) with scores, evidence summaries, and vendor disclosure status"
        - "Market segment analysis (7 segments)"
        - "Methodology summary with link to full methodology page"
        - "The Disclosure Statement"
        - "Data visualization: overall ranking charts, category comparison matrices, market segment maps"
    - name: "Category Summary Pages (7 pages, one per scoring category)"
      components:
        - "Which tools scored highest in this category and why"
        - "What this category measures and why practitioners care"
        - "Notable patterns or gaps"
    - name: "Individual Tool Profiles (27+ pages, one per tool)"
      components:
        - "Tool overview and market segment classification"
        - "Scores across all applicable categories with confidence tags"
        - "Strengths and limitations based on evaluation evidence"
        - "Vendor disclosure status (submitted / not submitted / declined)"
        - "Pricing summary (where available)"
        - "'Best for' use case guidance"
    - name: "Launch Announcement Post"
      components:
        - "What AISearchArena is, why it exists, what the first benchmark found"
        - "Links to full report, methodology, disclosure"
    - name: "Data Visualization Package"
      components:
        - "Overall ranking chart (both tracks)"
        - "Category comparison matrix"
        - "Market segment map"
        - "Score distribution chart"
        - "All visualizations designed for social media sharing (proper dimensions, readable at small size, AISearchArena branding)"

  workflow:
    benchmark_reports:
      label: "Highest editorial standard"
      steps:
        - "Evaluation data compiled from 6 independent analyses"
        - "Score synthesis by editorial lead"
        - "Confidence tagging review"
        - "Vendor pre-publication notification (5 business days)"
        - "Vendor response processing (3 business days)"
        - "Final editorial review: accuracy, disclosure presence, vocabulary compliance"
        - "Publication"
    analysis_and_blog_posts:
      label: "Standard editorial"
      steps:
        - "Draft by author"
        - "Fact-check against benchmark data"
        - "Vocabulary compliance review"
        - "Disclosure inclusion verification (for any content referencing specific tools)"
        - "Publication"
    social_media:
      label: "Light editorial"
      steps:
        - "Content drafted per channel guidelines"
        - "Fact-check data points against published benchmark"
        - "Ensure disclosure requirements met (per channel guidelines)"
        - "Publish"

  editorial_independence:
    firewall_policy:
      - "AISearchArena editorial content (benchmark reports, tool profiles, category analyses) is produced independently of AI Search Mastery's commercial interests"
      - "No AI Search Mastery commercial stakeholder has editorial input on benchmark scores, tool profiles, or benchmark-related analysis"
      - "AI Search Mastery marketing cannot request changes to benchmark content for commercial reasons"
      - "If AI Search Mastery products score well, evidence documentation is published more thoroughly (higher standard, not lower)"
      - "If AI Search Mastery products score poorly, scores publish without editorial softening"
    structural_enforcement:
      - "Benchmark editorial decisions are documented (which tools evaluated, methodology choices, score disputes) and available for review"
      - "The editorial lead has final authority on benchmark content. This authority cannot be overridden by AI Search Mastery commercial leadership on editorial matters"
      - "Quarterly independence audit: review all benchmark decisions to verify no commercial influence"

  correction_and_update_policy:
    corrections:
      - "Corrections are published with the same prominence as the original error"
      - "Correction notice includes: what was incorrect, what is correct, when the correction was made, and why"
      - "Original content is updated with correction inline (not just appended)"
      - "Correction notice remains permanently visible on the corrected content"
      - "If a correction affects a tool's score, the tool's vendor is notified"
      - "All corrections are logged in a publicly accessible corrections register"
    updates:
      - "Updated content includes a clear 'Last Updated: [date]' indicator with summary of what changed"
      - "If an update significantly changes conclusions, a note is added at the top of the content"
      - "Monthly benchmark reports are not retroactively updated; corrections are published as errata and incorporated into the next month's report"
    restatements:
      - "If a systematic error is discovered that affects multiple scores, a full restatement is published"
      - "Restatement includes complete explanation of what went wrong, what is corrected, and what steps prevent recurrence"
      - "All affected vendors are notified directly"
      - "Restatement is announced via email newsletter and social media"

  minimum_viable_content_team:
    - role: "Editorial lead"
      responsibility: "Benchmark report production, editorial standards, methodology documentation, vendor relations"
      time_commitment: "Full-time equivalent (or near)"
    - role: "Content creator"
      responsibility: "Blog posts, analysis pieces, practitioner guides, social media"
      time_commitment: "Part-time to full-time (scales with content volume)"
    - role: "Data visualization designer"
      responsibility: "Monthly visualization packages, shareable assets"
      time_commitment: "Part-time (10-15 hours/month)"
    - role: "Community manager"
      responsibility: "Community engagement, social media management, response handling"
      time_commitment: "Part-time (15-20 hours/month)"
  scaling_note: >
    Months 1-3 require the highest intensity (launch, methodology series, credibility establishment).
    The content cadence in Months 4-12 is sustainable with the team above. If resources are constrained,
    reduce analysis posts and practitioner guides before reducing benchmark reports or methodology content.

  content_priority_hierarchy:
    - tier: 1
      label: "Non-negotiable"
      items:
        - "Monthly benchmark report"
        - "Tool profiles"
        - "'What Changed' summary"
        - "Disclosure page maintenance"
    - tier: 2
      label: "High priority"
      items:
        - "Methodology education content"
        - "Email newsletter"
        - "Social media benchmark distribution"
    - tier: 3
      label: "Important"
      items:
        - "Practitioner guides"
        - "Category deep-dives"
        - "Community engagement"
    - tier: 4
      label: "Desirable"
      items:
        - "Market trend analysis"
        - "Vendor ecosystem mapping"
        - "Guest posts"
        - "Video content"
        - "Conference presentations"
  guidance: "Never sacrifice Tier 1 for Tier 3 or 4. A consistent, on-time monthly benchmark with minimal supporting content builds more credibility than an ambitious content calendar that misses benchmark deadlines."

seo_strategy:
  keyword_categories:
    primary:
      label: "High-intent, tool evaluation"
      clusters:
        - keyword: "'best GEO tools [year]'"
          search_intent: "Evaluation / comparison shopping"
          content_mapping: "Monthly benchmark report, overall rankings"
        - keyword: "'[specific tool name] review' / '[tool name] vs [tool name]'"
          search_intent: "Tool evaluation"
          content_mapping: "Individual tool profiles, comparison content"
        - keyword: "'AI search optimization tools comparison'"
          search_intent: "Structured comparison shopping"
          content_mapping: "Benchmark reports, category comparison pages"
        - keyword: "'GEO tool benchmark' / 'AEO tool benchmark'"
          search_intent: "Looking for structured evaluation"
          content_mapping: "Homepage, benchmark reports, methodology"
        - keyword: "'[category] GEO tools' (e.g., 'enterprise GEO tools')"
          search_intent: "Segment-specific evaluation"
          content_mapping: "Market segment pages"
        - keyword: "'AI search tools pricing'"
          search_intent: "Budget-driven evaluation"
          content_mapping: "Pricing & Value category page, budget comparison guides"
        - keyword: "'llms.txt tools' / 'llms.txt generator'"
          search_intent: "Specific tool type evaluation"
          content_mapping: "llms.txt Tooling Track benchmark, tool profiles"

    secondary:
      label: "Informational, market intelligence"
      clusters:
        - keyword: "'GEO tools market' / 'AEO tools landscape'"
          search_intent: "Market understanding"
          content_mapping: "Market trend analysis, vendor ecosystem mapping"
        - keyword: "'how to choose GEO tools' / 'selecting AI search tools'"
          search_intent: "Decision framework"
          content_mapping: "Practitioner evaluation guides"
        - keyword: "'AI search optimization' + 'tools'"
          search_intent: "Discovery and learning"
          content_mapping: "Blog content, category education"
        - keyword: "'GEO tool features' / 'what to look for in GEO tools'"
          search_intent: "Feature evaluation"
          content_mapping: "Category buying guides, scoring category pages"

    long_tail:
      - "'[tool name] pricing [year]'"
      - "'[tool name] for [use case]' (agencies, solopreneurs, enterprise)"
      - "'[tool name] alternatives'"
      - "'[category] GEO tools for small business'"
      - "'AI search tool comparison [year]'"

  technical_requirements:
    - "Clean URL structure reflecting site architecture (/benchmark/, /tools/, /categories/, /segments/)"
    - description: "Structured data (schema.org)"
      types:
        - "Product reviews (individual tool profiles)"
        - "Article (analysis posts, blog content)"
        - "FAQ (methodology questions)"
        - "Organization (AISearchArena)"
    - "Internal linking strategy: every tool profile links to relevant category pages, segment pages, and benchmark reports. Every analysis post links to source benchmark data"
    - "Canonical URLs for all content (prevent duplicate content issues with syndicated or cross-posted material)"
    - "Fast page load (benchmark reports with data visualizations need performance optimization)"
    - "Mobile-responsive design (practitioners evaluate tools from all devices)"

  content_freshness_signals:
    - "Monthly updates to tool profiles (Google rewards frequently updated content)"
    - "Monthly benchmark reports (new content on a predictable cadence)"
    - "Date stamps on all content with clear 'last updated' indicators"
    - "Methodology changelog demonstrates ongoing maintenance"

  backlink_strategy:
    approach: "The most sustainable backlink strategy for a benchmark is making citation easy and valuable."
    citation_infrastructure:
      - "Published citation guidelines on the press/media kit page"
      - "Embed codes for data visualizations (copy-paste HTML that includes attribution and link back)"
      - "Creative Commons licensing on data visualizations and summary graphics"
      - "Structured data downloads (CSV, JSON) for researchers and analysts who want to work with the data"
      - "'Cite this data' button on every benchmark report and tool profile"
    citation_outreach:
      - "When media or newsletters publish content about GEO/AEO tools, proactively offer benchmark data as a source"
      - "When practitioners share tool evaluations on social media, offer supporting data from the benchmark"
      - "Pitch data-driven guest posts to SEO and marketing publications (Search Engine Journal, Search Engine Land, Moz Blog, Ahrefs Blog)"
      - "Provide structured data for industry reports and market analyses"
    natural_backlink_drivers:
      - "Monthly benchmark reports create recurring citation opportunities"
      - "Controversial or surprising findings generate discussion and linking"
      - "Methodology transparency invites links from people explaining or discussing the approach"
      - "Vendor reactions (positive or negative) generate industry discussion and links"

  topic_clusters:
    - id: 1
      name: "GEO/AEO Tool Evaluation"
      pillar: "Benchmark"
      hub: "Monthly benchmark report"
      spokes: "Individual tool profiles, category comparisons, segment analyses"
      supporting: "'Best [category] GEO tools' posts, tool vs. tool comparisons"
    - id: 2
      name: "AI Search Tool Selection"
      pillar: "Practitioner Guides"
      hub: "'How to Choose a GEO Tool' comprehensive guide"
      spokes: "Use-case specific guides, budget comparisons, feature comparison matrices"
      supporting: "Category buying guides, migration guides"
    - id: 3
      name: "GEO/AEO Market Intelligence"
      pillar: "Market Trends"
      hub: "Quarterly market state report"
      spokes: "Monthly trend posts, segment competitive analyses, category evolution tracking"
      supporting: "New tool spotlights, vendor update roundups"
    - id: 4
      name: "Benchmark Methodology"
      pillar: "Methodology Education"
      hub: "Methodology page"
      spokes: "'How We Score' series (7 posts), methodology decision explainers"
      supporting: "Methodology update posts, 'Behind the Benchmark' process posts"
    - id: 5
      name: "llms.txt Tooling"
      pillar: "Benchmark, Track 2"
      hub: "llms.txt Tooling Track benchmark report"
      spokes: "Individual llms.txt tool profiles, llms.txt category analysis"
      supporting: "'What Is llms.txt' explainer, llms.txt tool selection guide"

email_strategy:
  types:
    - type: "Monthly Benchmark Report"
      timing: "Week 4, publication day"
      content: "Executive summary, key findings, data visualizations, link to full report"
    - type: "Mid-Month Analysis"
      timing: "Week 2 (between benchmarks)"
      content: "Category deep-dive or trend analysis. Substantive content, not filler"
    - type: "Methodology Update"
      timing: "When methodology changes"
      content: "What changed, why, impact on scores"
    - type: "Quarterly Market Overview"
      timing: "End of quarter"
      content: "3-month trend summary, market-level insights, data highlights"
  segments:
    trigger: "Implement when subscriber base reaches 500+"
    by_practitioner_type:
      - "consultant/agency"
      - "in-house marketer"
      - "solopreneur"
    by_interest_area:
      - "specific categories"
      - "specific market segments"
    by_engagement_level:
      - "active readers"
      - "lapsed subscribers"
  automation:
    subscriber_acquisition:
      - "Email signup on every page (non-intrusive, clear value proposition)"
      - "Launch landing page with signup as primary CTA"
      - "Community posts and social media include signup link"
    key_rules:
      - "No email gating of benchmark data"
      - "Separate list from AI Search Mastery. No list sharing without explicit double opt-in"
  metrics:
    open_rate_target: "35%+"
    click_through_rate_target: "15%+"
    unsubscribe_rate_max: "below 1% per send"

social_media:
  platforms:
    twitter_x:
      handle: "@AISearchArena"
      role: "Real-time engagement, data sharing, industry conversation, discovery"
      launch_thread_format:
        - "Headline finding with link to full report"
        - "3-4 supporting findings with data visualizations"
        - "Methodology reminder with link"
        - "Disclosure statement with link"
        - "Call to action"
      ongoing_cadence:
        - "3-5 data points per week during publication week"
        - "2-3 category highlights per month"
        - "1-2 industry commentary per week"
    linkedin:
      role: "Professional positioning, practitioner reach, vendor engagement"
      format: "Long-form posts, articles for deeper analysis"
      cadence:
        - "Monthly benchmark summary"
        - "1-2 category analyses per month"
        - "1 methodology education per month"
        - "1-2 market commentary per month"
    youtube:
      role: "Benchmark breakdowns and methodology education for video-preferring practitioners"
      launch: "Month 4-7 (3-6 months after initial benchmark)"
      video_lengths:
        benchmark_breakdown: "10-15 minutes"
        category_deep_dive: "8-12 minutes"
        methodology_explainer: "5-8 minutes"
        quarterly_overview: "15-20 minutes"

partnerships:
  authority_building:
    data_citation:
      goal: "Make AISearchArena the easiest-to-cite source of GEO/AEO tool data"
      infrastructure:
        - asset: "Citation guidelines page"
          purpose: "Tells media, researchers, and practitioners exactly how to cite benchmark data"
        - asset: "Embed codes for visualizations"
          purpose: "One-click embedding of charts and graphics with built-in attribution"
        - asset: "Data download (CSV/JSON)"
          purpose: "Structured data for researchers and analysts"
        - asset: "'Cite this' button on reports"
          purpose: "Generates formatted citation (APA, Chicago, plain text)"
        - asset: "Creative Commons license on visuals"
          purpose: "Removes legal friction from sharing and citing"
        - asset: "Press contact for data inquiries"
          purpose: "Direct line for media needing benchmark data for stories"
      active_citation_building:
        - "Monitor mentions of GEO/AEO tools in media and newsletters. When a publication discusses tool comparisons without structured data, reach out with benchmark data and citation guidelines"
        - "When benchmark data is cited, amplify the citing publication on social media (creates positive reinforcement for future citations)"
        - "Track citation sources and develop relationships with recurring citers"
        - "Publish a quarterly 'Data in the Wild' roundup showing how benchmark data has been used (encourages future citation)"

    press_and_analyst_relations:
      phase_1:
        label: "Introduction (Months 1-3)"
        activities:
          - "Pre-launch media outreach to 10-15 journalists and newsletter writers covering GEO/AEO"
          - "Offer methodology preview and first-benchmark embargo access"
          - "Position as a data source, not a product launch: 'structured data for your reporting'"
          - "Accept that most coverage in Month 1 will focus on the conflict of interest. That is fine. Engage with it openly"
      phase_2:
        label: "Relationship Building (Months 4-6)"
        activities:
          - "Monthly press notification when benchmark publishes (brief email with key findings and link)"
          - "Pitch data-driven story angles based on benchmark findings"
          - "Offer commentary for stories about the GEO/AEO market"
          - "Build a press contact database segmented by beat (SEO tools, AI/ML, marketing technology, small business)"
      phase_3:
        label: "Regular Source (Months 7-12)"
        activities:
          - "By Month 7, target being a regular source for 5+ publications covering the GEO/AEO space"
          - "Provide exclusive data previews to high-value media contacts (under embargo, with standard disclosure)"
          - "Pitch quarterly market overview reports as newsworthy events"
          - "Consider annual 'State of GEO Tools' report as a major media event"

    conference_strategy:
      phase_1:
        label: "Attend and Present Data (Months 1-6)"
        activities:
          - "Identify 3-5 relevant conferences in the March-August 2026 period"
          - "Submit speaking proposals centered on benchmark data: 'What Monthly Benchmarking of 27+ GEO Tools Reveals About the Market'"
          - "Attend industry events as participants and network with practitioners, vendors, and media"
          - "Share benchmark data in presentations (with full disclosure)"
      phase_2:
        label: "Establish Conference Presence (Months 7-12)"
        activities:
          - "Target speaking slots at 2-3 major industry conferences"
          - "Consider hosting a small practitioner roundtable or workshop focused on tool evaluation methodology"
          - "Publish conference-specific benchmark summaries aligned with conference themes"
      target_conferences:
        - category: "SEO industry conferences"
          examples: "BrightonSEO, MozCon, SearchLove"
        - category: "Marketing technology conferences"
          examples: "MarTech, Content Marketing World"
        - category: "AI/search conferences"
          examples: "Relevant AI conferences with search tracks"
        - category: "Digital marketing summits"
          examples: "With practitioner attendance"

    guest_content:
      strategy:
        - "Target 1 guest post per month starting Month 3"
        - "Focus on publications read by practitioners: Search Engine Journal, Search Engine Land, Moz Blog, Ahrefs Blog, Content Marketing Institute"
        - "Guest posts are data-driven, not promotional. Lead with benchmark findings and market insights. Link to AISearchArena for source data"
        - "Every guest post includes the AISearchArena Disclosure Statement (abbreviated version)"
        - "Do not accept payment for guest posts. Do not pay for placement. The content stands on its own value"
      collaboration_opportunities:
        - "Joint analysis with non-competing research organizations or publications"
        - "Data partnerships with industry newsletters (provide data, they provide distribution)"
        - "Co-hosted webinars with practitioner communities (present benchmark findings, facilitate discussion)"
        - "Methodology peer review invitations (invite external experts to review and comment on the methodology publicly)"

    community_engagement_playbook:
      monthly_cadence:
        - activity: "Share monthly benchmark summary"
          cadence: "Monthly, publication week"
          communities: "All target communities"
        - activity: "Participate in tool evaluation discussions"
          cadence: "Ongoing, as discussions arise"
          communities: "SEO communities, marketing forums"
        - activity: "Answer methodology questions"
          cadence: "Ongoing"
          communities: "Wherever questions appear"
        - activity: "Share category deep-dives"
          cadence: "2x per month"
          communities: "Communities relevant to the specific category"
        - activity: "Host or participate in AMAs"
          cadence: "Quarterly"
          communities: "r/SEO, relevant Slack/Discord communities"
      trust_building_escalation:
        - phase: "Introduction"
          months: "1-2"
          approach: "Share methodology. Ask for feedback. Be transparent about who we are and what we are building"
        - phase: "Contribution"
          months: "3-6"
          approach: "Share data that helps community members. Answer questions with benchmark data. Become a useful resource"
        - phase: "Authority"
          months: "7-12"
          approach: "Community members reference the benchmark in their own tool discussions. Organic mentions exceed our own posts"

growth_strategy:
