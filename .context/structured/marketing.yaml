# AISearchArena Content & Launch Strategy - Structured YAML Extraction
# Source: docs/foundation/content-launch-strategy.md
# Extracted: 2026-02-28
# Version: 1.0

meta:
  document_version: "1.0"
  created: "2026-02-23"
  status: "Foundation Document"
  owner: "@content-creation"
  parent_ecosystem: "AI Search Mastery"
  first_benchmark_target: "March 2026"
  planning_horizon: "12 months (March 2026 -- February 2027)"
  document_purpose: >
    This document governs what content AISearchArena.com creates, when it publishes,
    where it distributes, and how it measures success -- from pre-launch preparation
    through the first 12 months of operation. Every content decision, editorial calendar
    entry, and distribution choice should trace back to this strategy.
  relationship_to_other_docs: >
    This document operationalizes the principles established in the Vision & Mission
    and Positioning Statement. It does not restate those principles; it implements them as content.

pre_launch_requirements:
  overview: >
    The following content must exist on AISearchArena.com before any benchmark data publishes.
    This is non-negotiable. The positioning statement requires that methodology, disclosure,
    and vendor engagement infrastructure are visible before the first score appears.

  items:
    - id: "1.1"
      name: "Methodology Page"
      priority: "P0"
      priority_label: "Critical -- must be live before any benchmark content"
      target_completion: "February 14, 2026"
      owner: "Editorial lead"
      content_requirements:
        - "Complete description of the 7 scoring categories (AI Engine Coverage, Analytics & Reporting, Optimisation Capabilities, Pricing & Value, Trust & Security, Integration & Workflow, Usability & Onboarding)"
        - "Explanation of the 1-5 scoring scale with concrete examples of what each level means"
        - "Confidence tagging system explanation (High / Medium / Low / Insufficient Data) with examples"
        - "70/30 prompt rotation methodology: what it means, why it exists (consistency vs. anti-gaming), how it works"
        - "Multi-source synthesis process: how 6 independent analyses are combined"
        - "Evidence artifact requirements: what documentation backs every score"
        - "Category applicability matrix: how tools are assigned to market segments"
        - "Weighting rationale: how category scores combine into overall ratings"
        - "Two benchmark tracks explained: GEO Platform Track and llms.txt Tooling Track"
        - "Methodology versioning approach: how changes are documented and how historical comparisons remain valid"
        - "The Disclosure Statement (verbatim from Positioning Statement Section 5)"
      format: "Long-form page. No paywall. No email gate. Fully accessible. Anchor links for each section so individual criteria can be referenced directly."
      vocabulary_compliance: >
        Uses "benchmark" not "review." Uses "evaluation" not "rating." Uses "conflict of interest"
        directly, not "potential" or "perceived" conflict. Does not use "unbiased" or "objective."

    - id: "1.2"
      name: "Conflict of Interest Disclosure Page"
      priority: "P0"
      priority_label: "Critical -- must be live before any benchmark content"
      target_completion: "February 14, 2026"
      owner: "Editorial lead"
      content_requirements:
        - "The full Disclosure Statement from the Positioning Statement"
        - "Description of each AI Search Mastery product that falls within benchmark scope (AImpactScanner, LLM.txt Mastery)"
        - "Each of the 8 structural safeguards explained in plain language"
        - "How affiliated product scores are handled (published with the same methodology, higher evidence documentation standard)"
        - "How vendor financial relationships (if any develop) will be disclosed"
        - "Statement that this page will be updated whenever the conflict landscape changes"
        - "Link to methodology page"
        - "Link to vendor disclosure template"
      format: "Standalone page, linked from main navigation. Not buried in a footer or FAQ."

    - id: "1.3"
      name: "Vendor Disclosure Template and Participation Guide"
      priority: "P0"
      priority_label: "Critical -- must be available before vendor outreach begins"
      target_completion: "February 7, 2026"
      owner: "Editorial lead"
      vendor_disclosure_template:
        content_requirements:
          - "Structured form/document that vendors can complete to provide context about their tool"
          - "Fields for: product description, recent updates, known limitations, pricing model, target use cases, corrections to public information"
          - "Clear statement of how vendor disclosures are used (context for evaluation, factual corrections considered, does not influence scoring methodology)"
          - "Submission process and timeline"
      participation_guide:
        content_requirements:
          - "What the benchmark is and how it works (summary with link to full methodology)"
          - "What vendors should expect: evaluation timeline, pre-publication notification, right-of-reply process"
          - "What vendors can do: submit disclosure template, provide factual corrections, respond to pre-publication notification"
          - "What vendors cannot do: influence methodology, negotiate scores, receive advance access beyond standard pre-publication window"
          - "FAQ addressing common vendor concerns"
          - "Contact information for vendor liaison"
      format: "PDF template (downloadable) and web page. Both formats available."

    - id: "1.4"
      name: "About Page"
      priority: "P1"
      priority_label: "High -- live before launch"
      target_completion: "February 21, 2026"
      owner: "Editorial lead"
      content_requirements:
        - "What AISearchArena is: a monthly independent benchmark of AI search optimization tools"
        - "Why it exists: the market gap (practitioners lack structured, independent comparison data)"
        - "Who operates it: AI Search Mastery, with explicit acknowledgment of the branded house relationship"
        - "Core purpose statement (from Vision & Mission)"
        - "Core values summary with links to full descriptions"
        - "The team and their practitioner credentials"
        - "Relationship to AI Search Mastery ecosystem: what AISearchArena provides, what the ecosystem provides, the firewall"
        - "Design principles (the 8 non-negotiable constraints from Vision & Mission Section 12)"
        - "Contact information"
      vocabulary_compliance: >
        Describes AISearchArena as a "benchmark," not a "review site." Does not claim to be
        "the definitive" or "the best" -- uses "the first independent monthly benchmark" if
        first-mover claim is accurate.

    - id: "1.5"
      name: "How We Score Page"
      priority: "P1"
      priority_label: "High -- live before launch"
      target_completion: "February 21, 2026"
      owner: "Editorial lead"
      content_requirements:
        - "Practitioner-accessible version of the methodology (the methodology page is comprehensive; this page is the accessible summary)"
        - "Visual overview of the scoring process: tool selection, evaluation criteria, multi-source synthesis, confidence tagging, vendor review, publication"
        - "Walkthrough of a hypothetical evaluation: 'Here is how a tool moves through our process'"
        - "Category-by-category explanation of what is measured and why practitioners care"
        - "How to read a benchmark report: interpreting scores, confidence tags, category applicability"
        - "How to weight criteria to your own situation (e.g., 'if you are a solopreneur on a budget, weight Pricing & Value and Usability higher')"
      format: "Visual, scannable, practitioner-friendly. Uses diagrams, tables, and examples. Links to full methodology page for detail."

    - id: "1.6"
      name: "Press and Media Kit"
      priority: "P2"
      priority_label: "Medium -- available before launch announcement"
      target_completion: "February 21, 2026"
      owner: "Editorial lead"
      content_requirements:
        - "One-page overview of AISearchArena (what, why, how, who)"
        - "Key facts sheet: 27+ tools, 7 categories, 50+ metrics, monthly cadence, March 2026 launch"
        - "The Disclosure Statement"
        - "Condensed positioning statement (one paragraph, from Positioning Statement Section 6)"
        - "High-resolution logo assets and brand mark usage guidelines"
        - "Founder/team bios and headshots"
        - "Approved quotes for media use"
        - "Contact information for press inquiries"
        - "Embargo policy for pre-publication benchmark data"
        - "Data citation guidelines: how to properly attribute AISearchArena data"
      format: "Web page with downloadable assets (ZIP). Individual assets also available for selective download."

    - id: "1.7"
      name: "Launch Announcements"
      priority: "P1"
      priority_label: "High"
      target_completion: "Teaser by February 21, 2026; full announcement by March launch date"
      owner: "Editorial lead"
      teaser_announcement:
        timing: "February 2026"
        content:
          - "What is coming: the first independent monthly benchmark for AI search optimization tools"
          - "What makes it different: published methodology, multi-source synthesis, conflict disclosure"
          - "When: March 2026"
          - "How to be notified: email signup"
          - "Vendor invitation: how to participate via disclosure template"
        tone: "Confident but measured. No hype. Let the concept speak for itself."
      full_launch_announcement:
        timing: "March 2026, with first benchmark"
        content:
          - "The first benchmark is live: what it covers, how to access it"
          - "Summary of key findings (top-level, directing to full report)"
          - "Methodology reminder with link"
          - "Disclosure reminder with link"
          - "How practitioners should use this: shortlisting, decision support, tracking"
          - "What comes next: monthly cadence commitment"

pre_launch_outreach:
  vendor_notification:
    timeline: "February 7-14, 2026 (after vendor disclosure template is ready)"
    owner: "Vendor relations lead"
    initial_notification:
      channel: "email"
      actions:
        - "Inform each of the 27+ tools that AISearchArena will begin publishing monthly benchmark evaluations in March 2026"
        - "Provide the vendor disclosure template"
        - "Link to the published methodology (or methodology preview if not yet live)"
        - "Explain the pre-publication notification and right-of-reply process"
        - "Clarify that evaluation proceeds with or without vendor participation, but participation strengthens accuracy"
      tone: "Professional, respectful, transparent. This is notification, not a sales pitch. We are not asking permission; we are offering engagement."
    follow_up:
      timing: "1 week later"
      approach: "Brief follow-up for vendors who have not acknowledged. No pressure. Document non-responses (noted in benchmark as 'vendor did not respond to outreach')."
    key_messaging:
      - "The benchmark exists to help practitioners make better tool decisions"
      - "The methodology is standardized and published"
      - "AI Search Mastery products are evaluated under the same methodology and the conflict is disclosed"
      - "Vendor disclosure is optional but improves evaluation accuracy"
      - "Pre-publication review window is standard for all vendors"

  influencer_seeding:
    timeline: "February 14-28, 2026"
    owner: "Editorial lead"
    target_categories:
      - category: "SEO thought leaders with AI search focus"
        why: "Credibility validators; their endorsement carries weight with practitioners"
        approach: "Personal outreach. Share methodology preview. Ask for feedback, not promotion"
      - category: "Marketing newsletter operators (GEO/AEO coverage)"
        why: "Distribution amplifiers; they reach our target audience regularly"
        approach: "Offer exclusive preview of methodology or first benchmark findings. Provide data citation guidelines"
      - category: "AI search tool commentators (YouTube, podcast)"
        why: "They shape practitioner opinion on tool selection"
        approach: "Offer methodology interview or first-look at benchmark framework"
      - category: "SEO community moderators"
        why: "Gate access to practitioner communities where the benchmark should be discussed"
        approach: "Early notification. Position as a resource for their community, not as self-promotion"
    target_count_per_category: "3-5"
    outreach_principles:
      - "Lead with the methodology and the disclosure, not with the scores"
      - "Ask for feedback on the approach, not for promotion"
      - "Offer something useful (exclusive preview, early access to methodology, data citation for their content)"
      - "Be transparent about the conflict of interest from the first contact"
      - "Do not ask influencers to endorse the benchmark before they have seen results"
      - "Accept criticism. If an influencer challenges the conflict or the methodology, engage substantively"
    what_we_offer:
      - "Pre-launch methodology review (their feedback improves the product)"
      - "First-look access to the first benchmark (under embargo, with clear terms)"
      - "Standing invitation to cite data with attribution guidelines"
      - "Availability for interviews and commentary"
    what_we_do_not_offer:
      - "Payment for coverage"
      - "Affiliate relationships"
      - "Preferential benchmark treatment for their tools (if applicable)"
      - "Editorial control over their coverage"

  cross_promotion:
    timeline: "February 21 -- March launch"
    owner: "Editorial lead (with sign-off from both AISearchArena editorial and AI Search Mastery marketing)"
    tension: >
      AI Search Mastery's audience is the exact practitioner audience AISearchArena serves.
      Cross-promotion is efficient. But over-promotion risks making the benchmark look like
      a marketing play for the parent brand.
    approach: "Arm's Length Announcement"
    what_asm_can_publish:
      - "A single announcement post: 'We are launching an independent monthly benchmark for AI search optimization tools. Here is what it is, here is the methodology, here is the disclosure.'"
      - "The announcement must include the full conflict disclosure"
      - "The announcement links to AISearchArena.com for all detail; it does not republish benchmark data on AI Search Mastery properties"
      - "Tone is informational, not promotional. 'We built this because the market needs it' not 'check out our amazing new benchmark'"
    what_asm_does_not_do:
      - "Does not embed benchmark scores or rankings in its own content (that is AISearchArena's content)"
      - "Does not use benchmark results to promote AImpactScanner or LLM.txt Mastery ('our tool scored X!' is a vendor marketing move, not an editorial one)"
      - "Does not repeatedly promote the benchmark in newsletters, social, or content. One announcement. Subsequent references are contextual not promotional pushes"
      - "Does not gate AISearchArena content behind AI Search Mastery email lists"
    ongoing_guidelines:
      permitted:
        - "AI Search Mastery can reference AISearchArena when contextually relevant (e.g., a blog post about choosing GEO tools can say 'AISearchArena publishes monthly comparative data')"
        - "References should be factual and link to the benchmark, not editorialize about results"
        - "AISearchArena does not promote AI Search Mastery products. The benchmark reports evaluate them; they do not sell them"
        - "AISearchArena email subscribers are a separate list from AI Search Mastery subscribers. No list sharing without explicit opt-in"

  community_seeding:
    timeline: "February 21 -- March launch (teaser), March launch onward (ongoing)"
    owner: "Community engagement lead"
    target_communities:
      - type: "SEO professional communities"
        targets: "r/SEO, r/bigseo, SEO-focused Slack/Discord groups"
        approach: "Share methodology approach. Ask for practitioner input on what metrics matter most. Position as 'we built this for people like you'"
      - type: "Marketing professional forums"
        targets: "r/marketing, marketing-focused LinkedIn groups, GrowthHackers"
        approach: "Share the market gap narrative: '$77M+ in VC funding, no independent benchmark.' Lead with the problem, not the solution"
      - type: "AI and search technology communities"
        targets: "r/artificial, AI-focused Discord servers, Hacker News (for launch)"
        approach: "Lead with the methodology and technical rigor. This audience values structural thinking"
      - type: "Newsletter and media communities"
        targets: "Journalist Slack groups, media Twitter/X communities"
        approach: "Position as a data source. 'Monthly structured data on the GEO/AEO tools market, methodology-transparent, freely citable'"
    engagement_rules:
      - "Participate, do not broadcast. Add value in discussions before introducing the benchmark"
      - "Be transparent about affiliation: 'I work on AISearchArena, which is part of AI Search Mastery' -- always disclosed"
      - "Lead with what the community gains (structured data, methodology they can verify, practitioner-relevant criteria), not what the benchmark needs (traffic, subscribers)"
      - "Do not spam. One introduction post per community, then contribute to discussions naturally"
      - "Accept and engage with skepticism. The conflict of interest will be raised. Have the answer ready: 'Here is the disclosure page. Here is the methodology. Verify it yourself.'"
      - "Respect community rules. If a community does not allow self-promotion, do not self-promote. Wait for organic opportunities or ask moderators"

content_pillars:
  - id: 1
    name: "The Monthly Benchmark (Core)"
    description: "The monthly benchmark report, tool profiles, category summaries, and 'What Changed' summaries."
    why_it_matters: "This is the product. Everything else supports or extends this."
    content_per_month: "1 benchmark report + 27+ tool profile updates + 7 category updates + 1 'What Changed' summary"
    audience_served: "All three audiences (practitioners, vendors, media)"
    content_types:
      - "Monthly benchmark reports"
      - "Individual tool profiles (27+ per month)"
      - "Category summary pages (7 per month)"
      - "'What Changed' month-over-month summaries"
    frequency: "Monthly"

  - id: 2
    name: "Methodology Education"
    description: >
      Content that explains how the benchmark works, why specific methodology choices were made,
      and how practitioners can use the methodology to inform their own evaluations.
    why_it_matters: "Methodology transparency is the core differentiator. Content that explains the methodology builds trust and positions AISearchArena as rigorous."
    content_types:
      - name: "'How We Score' series"
        description: "Deep-dives into individual scoring categories. One post per category (7 posts over first 3 months, then refresh as methodology evolves)"
      - name: "Methodology decision explainers"
        description: "Why 70/30 prompt rotation? Why 6 independent analyses? Why confidence tagging? Each deserves its own post"
      - name: "Methodology update posts"
        description: "When the methodology changes, explain why"
      - name: "'Behind the Benchmark' posts"
        description: "Process transparency. How a typical evaluation cycle runs. What challenges arise. How edge cases are handled"
    frequency: "2-3 posts per month in Months 1-3 (front-loaded to establish credibility), then 1-2 per month ongoing"
    audience_served: "Primarily practitioners (builds trust), secondarily media (provides citable methodology detail), tertiarily vendors (demonstrates fairness)"

  - id: 3
    name: "Market Trends and Analysis"
    description: >
      Insights derived from benchmark data about the GEO/AEO tools market as a whole --
      not individual tool evaluations, but market-level patterns.
    why_it_matters: "Market-level analysis is the content most likely to be cited by media and newsletter writers. It positions AISearchArena as a market intelligence source, not just a ranking."
    content_types:
      - name: "Monthly market trends"
        description: "Starting Month 3, when longitudinal data exists: 'What X Months of Data Tell Us About the GEO Tools Market'"
      - name: "Category trend reports"
        description: "How capabilities in a specific category are evolving across all tools"
      - name: "Market segment analysis"
        description: "Competitive dynamics within each of the 7 segments"
      - name: "Emerging pattern reports"
        description: "New capabilities appearing across multiple tools, pricing model shifts, integration trends"
      - name: "Quarterly market state reports"
        description: "Comprehensive quarterly analysis of the entire market"
    frequency: "1-2 posts per month starting Month 3. Quarterly comprehensive report."
    audience_served: "Primarily media and industry (citable market data), secondarily practitioners (market context for tool decisions)"

  - id: 4
    name: "Practitioner Tool Evaluation Guides"
    description: "Content that helps practitioners apply benchmark data to their specific situations."
    why_it_matters: "The benchmark provides data. These guides provide decision support. This is where the 'Practitioners First' value comes to life in content."
    content_types:
      - name: "'Which GEO Tool Is Right For [Use Case]?' guides"
        description: "Match benchmark data to specific practitioner situations (solopreneurs, agencies, enterprise, specific industries)"
      - name: "Category buying guides"
        description: "'What to Look For in GEO Analytics' using benchmark category data as the framework"
      - name: "Migration guides"
        description: "'Switching GEO Tools: What the Data Says About Transition Costs' (using Usability & Onboarding data)"
      - name: "Budget-tier comparisons"
        description: "'GEO Tools Under $X/Month: How They Compare' (using Pricing & Value data)"
      - name: "Feature comparison matrices"
        description: "Structured feature-by-feature comparisons for specific use cases, derived from benchmark data"
    frequency: "1-2 posts per month starting Month 2"
    audience_served: "Primarily practitioners (direct decision support)"

  - id: 5
    name: "Vendor Ecosystem Mapping"
    description: >
      Content that tracks and documents the GEO/AEO vendor ecosystem -- who is building what,
      how the market is structured, where consolidation or expansion is happening.
    why_it_matters: "The market is early-stage and changing fast. Documenting the ecosystem as it evolves builds the longitudinal record ('Build The Record' value) and serves as a reference for practitioners, media, and vendors."
    content_types:
      - name: "Market landscape overviews"
        description: "Periodically updated visual maps of the vendor ecosystem"
      - name: "New tool spotlights"
        description: "When a new tool enters the benchmark, an analysis of where it fits"
      - name: "Segment competitive analyses"
        description: "How tools within a segment compare and how segment boundaries are shifting"
      - name: "Vendor update roundups"
        description: "Monthly or bi-monthly summaries of significant vendor announcements, feature launches, and pricing changes (factual reporting, not promotional)"
      - name: "Category evolution tracking"
        description: "How the definition and scope of categories change as the market matures"
    frequency: "1 post per month starting Month 2"
    audience_served: "All three audiences. Practitioners get market context. Vendors see accurate categorization. Media gets structured market data."

