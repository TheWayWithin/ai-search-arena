# ==============================================================
# COMMUNICATION PRINCIPLES
# ==============================================================
communication_principles:

  cross_audience_principles:
    - id: 1
      principle: "Clarity over cleverness"
      detail: "Plain language. No jargon without definition. No cleverness at the expense of understanding."
      inherited_from: "Parent brand"
    - id: 2
      principle: "Honesty over hype"
      detail: >
        Report what we find, not what generates excitement. When a benchmark reveals no clear
        winner, we say so. When tools are too close to meaningfully differentiate, we say so.
      inherited_from: "Parent brand"
    - id: 3
      principle: "Show the work"
      detail: >
        Methodology is always published. Scoring criteria, weights, and processes are transparent.
        Anyone can understand how we arrived at our conclusions.
    - id: 4
      principle: "Separate data from opinion"
      detail: >
        Benchmark scores are data. Commentary is opinion. These are always clearly distinguished.
        Readers should never wonder whether a statement is a measured finding or an editorial judgment.
    - id: 5
      principle: "Respect all audiences equally"
      detail: >
        Tool Evaluators are not more important than vendors. Content Consumers are not less
        important than Tool Evaluators. Every audience interaction reflects the same standards
        of respect, transparency, and rigor.

  parent_brand_values:
    - "Clarity Over Cleverness"
    - "Honesty Over Hype"
    - "Action Over Analysis"
    - "Accessibility Is The Mission"
    - "Build To Evolve"

  audience_specific:

    audience_1_tool_evaluators:
      language:
        - "Practitioner-level. Assumes familiarity with SEO concepts but not deep GEO/AEO expertise."
        - "Concrete, specific, actionable. 'Tool X scored 8.4/10 on AI Engine Coverage, tracking 6 of 8 major AI models' -- not 'Tool X has great AI coverage.'"
        - "Comparison-oriented. Always frame data in context: relative to category averages, relative to competitors, relative to the evaluator's likely priorities."
        - "Decision-supporting. Every piece of content should move them closer to a decision, not further into analysis."
      tone:
        - "Confident but not arrogant. We stand behind our methodology and our findings, but we acknowledge limitations."
        - "Helpful, not salesy. We are here to serve their decision-making process, not to sell them anything."
        - "Respectful of their time. Front-load key findings. Make detailed data available but don't require reading it."
      key_messages:
        - "We evaluate every tool on the same criteria, every month. No exceptions."
        - "Our methodology is public. You can see exactly how we score."
        - "We have no affiliate relationships with any benchmarked tool."
        - "The benchmark is designed to help you choose. Not to choose for you."

    audience_2_industry_stakeholders:
      language:
        - "Professional and precise. Vendors have deep product knowledge; communication must be equally specific."
        - "Methodology-forward. Every score or ranking is accompanied by the criteria and process that produced it."
        - "Process-oriented. Communication about vendor participation (disclosure templates, right of reply, badge usage) follows documented procedures."
      tone:
        - "Fair and impartial. Every vendor interaction reflects the same level of respect, regardless of their benchmark score."
        - "Firm on boundaries. Independence is non-negotiable. This is communicated clearly, without defensiveness."
        - "Collaborative where appropriate. Vendors are partners in accuracy (through disclosure and right of reply) -- but not partners in scoring."
      key_messages:
        - "Every tool is evaluated on the same criteria. No exceptions, no pay-for-placement."
        - "You have a right of reply before publication. Your perspective will be heard."
        - "Your disclosure helps us evaluate accurately. Non-disclosure does not penalize you."
        - "We publish our methodology so you can understand every score."

    audience_3_content_consumers:
      language:
        - "Data-rich but digestible. Provide specific numbers, rankings, and findings in formats that are easy to extract and cite."
        - "Attribution-friendly. Make it easy for content creators to correctly attribute benchmark data."
        - "Narrative-ready. Present findings not just as data points but as stories: trends, shifts, surprises, emerging patterns."
      tone:
        - "Generous. We want benchmark data to be used, cited, and amplified. We are not precious about it."
        - "Collaborative. Content creators who reference the benchmark are allies, not competitors."
        - "Professional. Our data quality and presentation set the standard they are building on."
      key_messages:
        - "Use our data. Cite us. Build on our findings."
        - "The methodology page has everything you need to cite accurately."
        - "Monthly data. Consistent metrics. Always current."
        - "We provide the data. You provide the perspective."

# ==============================================================
# GLOSSARY
# ==============================================================
glossary:
  - term: "GEO"
    definition: "Generative Engine Optimization -- optimizing content to appear in AI-generated search responses"
  - term: "AEO"
    definition: "AI Engine Optimization -- optimizing for visibility across AI-powered search and answer engines"
  - term: "Benchmark cycle"
    definition: "One complete evaluation period, currently monthly, from tool evaluation through publication"
  - term: "Disclosure template"
    definition: "Structured form vendors can submit to provide current product information for evaluation"
  - term: "Right of reply"
    definition: "Vendor's opportunity to review and respond to their scores before publication"
  - term: "Pure-play GEO"
    definition: "Tools built specifically and exclusively for GEO/AEO optimization"
  - term: "Market segment"
    definition: "One of the 7 categories used to classify benchmarked tools (Pure-Play GEO, SEO Suite + GEO, Enterprise Suite + GEO, CMS + GEO, Content + GEO, Free/Freemium, llms.txt Tooling)"
  - term: "Scoring category"
    definition: "One of the 7 evaluation dimensions (AI Engine Coverage, Analytics & Reporting, Optimisation Capabilities, Pricing & Value, Trust & Security, Integration & Workflow, Usability & Onboarding)"