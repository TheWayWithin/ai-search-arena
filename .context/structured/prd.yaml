    - "Multi-model consensus (6 AI models per evaluation)"
    - "Transparent methodology with published audit packages"
    - "Proactive conflict-of-interest disclosure"
    - "Evidence-backed scores with confidence tags"
  evaluation_method:
    models_per_evaluation: 6
    scoring_scale: "0-10"
    metrics_count: "50+"
    tools_evaluated: "27+"
    cadence: "Monthly"
  brand_essence: "Rigor"
  editorial_firewall: true
  conflict_disclosure: "AI Search Mastery ownership disclosed on every page where scores appear"

