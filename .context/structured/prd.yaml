compliance:
  data_classification:
    - classification: "Public"
      description: "Published benchmark data intended for public consumption"
      examples: ["Published scores", "Composite rankings", "Methodology documentation", "Audit packages", "Badges", "Benchmark reports"]
      handling: "No access restriction; cached aggressively; SEO-indexed"

    - classification: "Internal"
      description: "Operational data used during evaluation, not published raw"
      examples: ["Draft scores", "ModelEvaluation raw outputs", "SynthesisRecord details", "Model agreement metrics", "Editor rationale", "AI model configurations", "Prompt sets"]
      handling: "Admin-only access; not exposed via public API; included in sealed audit packages"

    - classification: "Vendor Confidential"
      description: "Data shared with or about specific vendors under access controls"
      examples: ["Vendor contact information", "Pre-publication dimension scores (during VendorReview)", "Vendor correction claims", "Vendor financial disclosures"]
      handling: "Vendor sees only own data (BR-V04); admin access; encrypted at rest; access logged"

    - classification: "Restricted"
      description: "Highly sensitive data with strict access controls"
      examples: ["API keys for AI services", "Admin credentials", "Internal editorial deliberation notes", "Vendor PII beyond business contacts"]
      handling: "Encrypted at rest and in transit; minimal access; never included in audit packages; rotated regularly"

  privacy:
    - requirement: "Data minimization"
      standard: "GDPR Art. 5(1)(c)"
      implementation: "Collect only data necessary for benchmark evaluation; vendor PII limited to business contact"

    - requirement: "Purpose limitation"
      standard: "GDPR Art. 5(1)(b)"
      implementation: "Data collected for benchmark evaluation used only for that purpose; no secondary marketing use"

    - requirement: "Storage limitation"
      standard: "GDPR Art. 5(1)(e)"
      implementation: "Vendor contact information retained only while vendor has tools in active or archived cycles"

    - requirement: "Data subject rights"
      standard: "GDPR Art. 15-20"
      implementation: "Vendor can request access to/deletion of their contact data; published benchmark data (public) is not subject to erasure"

  data_retention:
    - data_type: "Published benchmark data"
      retention: "Indefinite (core product)"
    - data_type: "Evaluation raw data"
      retention: "Indefinite (audit trail requirement)"
    - data_type: "Vendor contact information"
      retention: "While vendor has tools in benchmark"
    - data_type: "Admin session data"
      retention: "24 hours (auto-expiry)"
    - data_type: "API keys"
      retention: "Until rotated; encrypted at rest"

  third_party_dpas:
    - service: "OpenAI"
      data_shared: "Tool names, evaluation prompts"
      dpa_required: true
    - service: "Anthropic"
      data_shared: "Tool names, evaluation prompts"
      dpa_required: true
    - service: "Google"
      data_shared: "Tool names, evaluation prompts"
      dpa_required: true
    - service: "Cohere"
      data_shared: "Tool names, evaluation prompts"
      dpa_required: true
    - service: "Mistral"
      data_shared: "Tool names, evaluation prompts"
      dpa_required: true
    - service: "Meta"
      data_shared: "Tool names, evaluation prompts"
      dpa_required: true
    - service: "Neon (PostgreSQL)"
      data_shared: "All application data"
      dpa_required: true
    - service: "Vercel"
      data_shared: "Application code, request logs"
      dpa_required: true
    - service: "Resend (email)"
      data_shared: "Vendor email addresses, subscriber emails"
      dpa_required: true

mvp_scope:
  in_scope:
    - "Evaluation engine (27+ tools scored by 6 AI models with median-based synthesis)"
    - "Public leaderboard with dimension scores, composite rankings, and confidence tags"
    - "Methodology transparency pages (scoring criteria, prompt rotation policy, confidence definitions)"
    - "Audit packages (sealed, SHA-256 hashed, downloadable) for every benchmark cycle"
    - "Admin dashboard for cycle management, score review, and publication workflow"
  out_of_scope:
    - "User accounts or public registration"
    - "Billing, payments, or subscription management"
    - "Vendor self-service portal (Phase 2)"
    - "Real-time evaluation or live scoring"
    - "Community features (reviews, comments, forums)"
    - "Tool comparison view (P1)"
    - "Badge awarding (P1)"
    - "Email notifications (P1/Sprint 5 stretch)"
    - "API access (Phase 3)"
    - "FAQ page"
    - "Career page or team profiles"

non_blocking_items:
  - id: 1
    item: "Scoring scale edge case: rounding at exact .X5 boundaries"
    context: "BR-S05 specifies one-decimal composites. T-052 tests boundaries. PRD does not prescribe rounding method."
    recommendation: "Use round half up (standard mathematical rounding). Document in methodology."
    owner: "Developer"

  - id: 2
    item: "Vendor disclosure template format"
    context: "F-015 specifies disclosure workflow but exact template fields not enumerated."
    recommendation: "Design minimal template (company name, tool name, factual corrections, supporting evidence URL) during Sprint 1."
    owner: "Developer"

  - id: 3
    item: "Prompt rotation schedule"
    context: "Business rule states 70/30 rotating prompts but cadence not specified."
    recommendation: "Rotate 30% each cycle (sequential replacement). Track retirements. Full UI deferred to Phase 2."
    owner: "Developer"

  - id: 4
    item: "Email notification content and frequency"
    context: "F-020 specifies email notifications but templates and triggers not detailed."
    recommendation: "Design minimal set: (1) vendor pre-publication notification, (2) cycle publication announcement. Simple templates for v1."
    owner: "Developer"

handoff:
  date: "2026-02-24"
  prd_version: "1.0"
  product_owner: "Jamie Watters (solopreneur -- also the developer)"
  response_time_sla: "Immediate (same person)"
  content_completeness: "23/23 items checked"
  quality_gates: "5/5 passed"
  blocking_questions_resolved: 5
  non_blocking_items: 4
  verdict: "READY FOR HANDOFF TO AGENT-11"

  priority_guidance:
    - "Start with Sprint 0: F-021 (infrastructure), F-025 (admin auth), F-017 (SEO foundation)"
    - "System Skeleton (Section 2) directly informs database schema -- 23 entities ready for migration"
    - "Business Rules (Section 2.4) are critical correctness requirements -- implement first, test thoroughly"
    - "State Machines (Section 2.4) for BenchmarkCycle and Score are operational backbone"
    - "GWT acceptance criteria (Section 3) map directly to test implementations"
    - "Preference Profile (Appendix A) guides technology selection but is not binding"

  known_complexities:
    - name: "Composite score calculation"
      detail: "Weighted average with renormalized weights for N/A. Rounding to one decimal. See BR-S05, T-048, T-052."
    - name: "Synthesis pipeline"
      detail: "Median-based aggregation from 6 models with confidence derivation (BR-S09). Must be deterministic (T-053). >= 4 models required (BR-S07, BR-S11)."
    - name: "Audit package immutability"
      detail: "CycleAuditPackage sealed before publication, immutable after (BR-AUD02). SHA-256 hash. See T-014, T-051."
    - name: "Concurrent cycle prevention"
      detail: "Only one active cycle at a time. Race condition testing required (T-050)."
    - name: "Vendor data isolation"
      detail: "Vendor portal enforces strict data boundary -- own tool data only (BR-V04, T-057). IDOR testing essential."
    - name: "Score correction cascade"
      detail: "Correcting published score triggers automatic composite recalculation and ranking update (T-054). Dual approval required (BR-S02)."

