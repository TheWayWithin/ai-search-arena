        - { path: "/methodology/:versionId", description: "Specific methodology version" }
        - { path: "/disclosure", description: "Conflict of interest disclosure" }
        - { path: "/about", description: "About page" }
        - { path: "/reports/:cycleId", description: "Published benchmark report" }
