        - id: "AC-007-03"
          given: "Evaluations are complete for a tool"
          when: "Fewer than 4 of 6 models returned successful responses"
          then: "The tool's evaluation is flagged as insufficient for synthesis (BR-S07, BR-S11); operator is alerted"
      mvp_rationale: "Core engine; produces the raw multi-model evaluations that feed synthesis"

