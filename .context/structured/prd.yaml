critical_user_journeys:
  - name: "First-Time Practitioner Discovery"
    steps:
      - "Practitioner searches for GEO/AEO tool comparison"
      - "Lands on homepage or leaderboard via organic search"
      - "Views top-ranked tools on leaderboard"
      - "Clicks through to tool detail page for preferred tool"
      - "Reviews dimension-level scores and evidence"
      - "Checks methodology page for evaluation credibility"
      - "Checks disclosure page for independence verification"
      - "Downloads audit package for deep verification (optional)"
      - "Makes purchasing decision based on benchmark data"

  - name: "Monthly Benchmark Production (Operator)"
    steps:
      - "Create new benchmark cycle (Draft)"
      - "Lock methodology version, transition to Planning"
      - "Enroll tools (minimum 5 per track), assign to tracks"
      - "Transition to Evaluation; system dispatches prompts to 6 AI models"
      - "Monitor evaluation progress; handle API failures"
      - "Transition to Synthesis; system aggregates responses"
      - "Review synthesized scores in Review state"
      - "Approve/adjust scores with audit trail"
      - "Transition to VendorReview; notify vendors (5 business day window)"
      - "Process vendor corrections (accept/reject)"
      - "Seal audit package (SHA-256 hash)"
      - "Publish benchmark; scores transition to Published"
      - "Verify public pages updated; cycle -> Completed"

  - name: "Vendor Pre-Publication Review"
    steps:
      - "Vendor receives notification with link to review portal"
      - "Vendor accesses only their own tool's scores (BR-V04)"
      - "Vendor reviews dimension scores and evidence"
      - "Vendor submits factual corrections with evidence (optional)"
      - "Operator reviews corrections within the window"
      - "Operator accepts, rejects, or requests more information"
      - "5-business-day window closes; unresolved corrections expire"

  - name: "Score Correction Post-Publication"
    steps:
      - "Error discovered in published score"
      - "Admin initiates correction with reason and new value"
      - "System validates dual-approval (BR-S02)"
      - "ScoreCorrection record created preserving original value"
      - "Score state transitions to Corrected"
      - "Composite scores automatically recalculated"
      - "Rankings updated"
      - "Public 'Corrected' indicator shown on tool detail page"
      - "Correction history accessible to all visitors"

  - name: "Tool Comparison Decision"
    steps:
      - "Practitioner views leaderboard for their market segment"
      - "Selects 2-4 tools for comparison"
      - "Reviews side-by-side dimension scores"
      - "Filters by relevant scoring categories"
      - "Identifies strongest tool for their specific needs"

edge_cases:
  scoring:
    - scenario: "All 6 AI models fail for a tool-dimension pair"
      expected: "Score receives confidence_tag = 'Insufficient Data'; flagged for operator attention"
    - scenario: "Exactly 4 of 6 models succeed"
      expected: "Synthesis proceeds with 4 models; confidence_tag adjusted based on agreement"
    - scenario: "Two tools have identical composite scores"
      expected: "Dense ranking; both receive the same rank"
    - scenario: "All dimensions are N/A for a tool"
      expected: "No composite score can be calculated; tool flagged for review"
    - scenario: "Rounding at exact .X5 boundary (e.g., 7.25)"
      expected: "Round half up (standard mathematical rounding, decided in non-blocking item #1)"
    - scenario: "Score value exactly 0 or exactly 10"
      expected: "Valid scores; no special handling"
    - scenario: "Composite score with only 1 applicable dimension"
      expected: "Composite equals that single dimension score (weight = 1.0 after renormalization)"

  cycle_management:
    - scenario: "Admin attempts to create cycle when another non-terminal cycle exists"
      expected: "Rejected; only one active cycle at a time (BR-T01)"
    - scenario: "Track has fewer than 5 enrolled tools when transitioning to Evaluation"
      expected: "Transition blocked; track deferred (BR-T03)"
    - scenario: "Tool withdrawn during VendorReview"
      expected: "Vendor review data preserved; tool excluded from rankings"
    - scenario: "Tool withdrawal drops track below 5 tools"
      expected: "Track deferred (BR-T03)"
    - scenario: "Admin attempts to transition Draft directly to Evaluation"
      expected: "Invalid transition rejected; must go through Planning"
    - scenario: "Race condition: two simultaneous cycle creation attempts"
      expected: "Only one succeeds; other rejected (T-050)"

  vendor:
    - scenario: "Vendor submits correction after 5-business-day window closes"
      expected: "Correction rejected; window expired"
    - scenario: "Vendor attempts to access another vendor's scores"
      expected: "IDOR prevented; 403 Forbidden (BR-V04)"
    - scenario: "No vendors respond to disclosure requests"
      expected: "Benchmark proceeds; disclosure status shown as 'None' (BR-V01)"
    - scenario: "Vendor review window starts on Friday"
      expected: "5 business days calculated excluding weekends"

  audit:
    - scenario: "Admin attempts to modify sealed audit package"
      expected: "Modification rejected (BR-AUD02)"
    - scenario: "Audit package SHA-256 hash does not match content on download"
      expected: "Tamper alert displayed to user"

  security:
    - scenario: "Unauthenticated user navigates to /admin/* route"
      expected: "Redirected to login; no admin content exposed"
    - scenario: "Admin session idle >24 hours"
      expected: "Session expired; redirect to login"
    - scenario: "5 failed login attempts"
      expected: "Account locked; brute-force protection"
    - scenario: "CSRF token missing on state-changing admin request"
      expected: "HTTP 403 Forbidden; no state change"
    - scenario: "Reusing expired session CSRF token"
      expected: "HTTP 403 Forbidden"

integration_tests:
  total_count: 60
  test_ids: "T-001 through T-060"
  risk_tiers:
    tier_1_credibility_critical:
      description: "Errors that would destroy benchmark trust and require public retraction"
      testing_approach: "100% automated, regression suite"
      examples: ["Score synthesis", "Composite calculation", "State machine transitions", "Audit immutability", "Data isolation"]
    tier_2_operational:
      description: "Errors that would block or corrupt the monthly publication workflow"
      testing_approach: "Automated integration tests"
      examples: ["API retry logic", "Evaluation pipeline", "Enrollment constraints", "Methodology lock"]
    tier_3_user_experience:
      description: "Errors that degrade the practitioner or admin experience"
      testing_approach: "Hybrid (automated for data, manual for visual)"
      examples: ["Leaderboard rendering", "Tool detail pages", "Filtering", "Sorting"]
    tier_4_cosmetic:
      description: "Visual or presentational issues"
      testing_approach: "Manual verification before each publication"
      examples: ["Static pages", "Badge display", "Print layouts", "Mobile responsiveness"]

  test_cases:
    # State Machine Tests (T-001 to T-010)
    - id: "T-001"
      name: "Cycle Happy Path"
      features: ["F-005"]
      type: "Integration"
      priority: "Critical"
      description: "Full lifecycle Draft -> Planning -> Evaluation -> Synthesis -> Review -> VendorReview -> Publication -> Completed"

    - id: "T-002"
      name: "Invalid State Transitions Rejected"
      features: ["F-005"]
      type: "Unit"
      priority: "Critical"
      description: "All 56 invalid state transitions are rejected"
      test_data: "Matrix of 10 states x 10 targets = 100 combinations; 14 valid, 86 invalid"

    - id: "T-003"
      name: "Concurrent Cycle Prevention"
      features: ["F-005"]
      type: "Integration"
      priority: "Critical"
      description: "Cannot create cycle when non-terminal cycle exists"

    - id: "T-004"
      name: "Methodology Version Locks on Planning Transition"
