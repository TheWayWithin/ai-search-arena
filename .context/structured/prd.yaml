    - id: "F-011"
      name: "Score Synthesis Pipeline"
      type: "WORKFLOW"
      touched_entities: ["SynthesisRecord", "ModelEvaluation", "Score", "ScoringDimension", "Tool", "BenchmarkCycle"]
      effort: "XL (5+ days)"
      dependencies: ["F-007"]
      description: "Transforms raw multi-model evaluations into publishable scores with confidence tags. Uses median-based aggregation across 6 model responses. Derives confidence from inter-model agreement. Normalizes scores to 0-10 scale. Must be deterministic. Produces SynthesisRecord and Score entities."
      acceptance_criteria:
        - id: "AC-011-01"
          given: "A tool has >= 4 successful model evaluations for a dimension"
          when: "Synthesis is executed"
          then: "A Score record is created with value (0-10, one decimal), confidence_tag (High/Medium/Low/Insufficient Data), and linked SynthesisRecord with model agreement metrics"
        - id: "AC-011-02"
          given: "A tool has < 4 successful model evaluations for a dimension"
          when: "Synthesis is attempted"
          then: "The dimension score receives confidence_tag = 'Insufficient Data' and is flagged for operator attention"
        - id: "AC-011-03"
          given: "Synthesis produces identical input data on two separate runs"
          when: "Both synthesis results are compared"
          then: "The outputs are identical (deterministic synthesis requirement)"
      mvp_rationale: "Transforms raw model evaluations into publishable scores with confidence tags"

