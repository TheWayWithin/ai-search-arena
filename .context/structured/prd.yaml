        - id: "AC-012-01"
          given: "All dimension scores for a tool are in Reviewed or Published state"
          when: "Composite score is calculated"
          then: "A CompositeScore record is created with the weighted average of applicable dimensions, renormalized weights for N/A dimensions, rounded to one decimal place"
        - id: "AC-012-02"
          given: "Composite scores exist for all non-withdrawn tools in a track"
          when: "Rankings are calculated"
          then: "Tools are ranked by descending composite score using dense ranking; ties receive the same rank"
        - id: "AC-012-03"
          given: "An operator reviews a synthesized score"
          when: "The operator approves, adjusts, or flags the score"
          then: "The action is recorded in the audit trail with operator ID, timestamp, original value (if adjusted), new value, and reason"
