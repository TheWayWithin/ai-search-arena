    - id: "F-025"
      name: "Admin Authentication"
      type: "WORKFLOW"
      touched_entities: []
      effort: "S (<1 day)"
      dependencies: []
      description: "Simple authentication gate for admin panel. Single admin user. Minimal: username/password or magic link with session management. No RBAC, no user management, no registration flow."
      acceptance_criteria:
        - id: "AC-025-01"
          given: "An unauthenticated visitor navigates to any /admin/* route"
          when: "The page loads"
          then: "Visitor redirected to login page; no admin content exposed"
        - id: "AC-025-02"
          given: "The admin enters valid credentials"
          when: "The login form is submitted"
          then: "Admin is authenticated, session created, redirected to admin dashboard"
        - id: "AC-025-03"
          given: "An authenticated admin session idle > 24 hours"
          when: "Admin attempts to access admin page"
          then: "Session expired; redirected to login page"
      technical_notes:
        session_expiry: "24 hours"
        lockout_threshold: "5 failed attempts"
        password_hashing: "bcrypt"
      mvp_rationale: "Security baseline; admin panel must not be publicly accessible"

  p1_should_have:
    - id: "F-004"
      name: "Tool Comparison View"
      type: "CRUD"
      touched_entities: ["Tool", "Score", "ScoringDimension", "CompositeScore", "BenchmarkTrackDefinition"]
      effort: "M (1-3 days)"
      dependencies: ["F-003"]
      description: "Side-by-side tool comparison on up to 4 tools, filterable by metric category. High-value practitioner feature."
      acceptance_criteria:
        - id: "AC-004-01"
          given: "A visitor is on the leaderboard or tool detail page"
          when: "The visitor selects 2-4 tools for comparison"
          then: "A comparison view displays all selected tools side-by-side with dimension scores, composite scores, and visual difference indicators"
        - id: "AC-004-02"
          given: "A comparison view is displayed"
          when: "The visitor filters by a specific scoring category"
          then: "Only dimensions within that category are shown in the comparison"
      target_phase: "Phase 1 (April 2026)"

    - id: "F-019"
      name: "Badge Awarding & Display"
      type: "WORKFLOW"
      touched_entities: ["Badge", "CompositeScore", "BenchmarkCycle", "Tool"]
      effort: "M (1-3 days)"
      dependencies: ["F-012"]
      description: "Automated badge generation for top performers per category, embeddable badge assets, badge verification page."
      acceptance_criteria:
        - id: "AC-019-01"
          given: "A cycle has been published with composite scores calculated"
          when: "Badge awarding is triggered"
          then: "Badges are awarded to qualifying tools based on predefined criteria (top performer per track, category leaders)"
        - id: "AC-019-02"
          given: "A tool has earned a badge"
          when: "The tool detail page is viewed"
          then: "The badge is prominently displayed with the cycle and category it was earned in"
      target_phase: "Phase 1 (April 2026)"

    - id: "F-020"
      name: "Cycle Archive & Historical Access"
      type: "CRUD / ANALYTICS"
      touched_entities: ["BenchmarkCycle", "BenchmarkReport", "CompositeScore"]
      effort: "M (1-3 days)"
      dependencies: ["F-014"]
      description: "Archive of past benchmark cycles with full historical access to reports, leaderboards, and tool scores."
      target_phase: "Phase 1 (May 2026)"

    - id: "F-021"
      name: "Vendor Directory & Profile Pages"
      type: "CRUD"
      touched_entities: ["Vendor", "Tool", "VendorDisclosure", "Badge"]
      effort: "S (<1 day)"
      dependencies: ["F-010"]
      description: "Public-facing vendor directory and individual vendor profile pages. Lists all vendors with disclosure status prominently displayed (BR-V01)."
      acceptance_criteria:
        - id: "AC-021-01"
          given: "Multiple vendors with published benchmark results exist"
          when: "A visitor navigates to /vendors"
          then: "Searchable list with company name, number of tools evaluated, disclosure status indicator (full/partial/none per BR-V01)"
        - id: "AC-021-02"
          given: "A visitor navigates to /vendors/:vendorId"
          when: "The page loads"
          then: "Displays vendor name, website, disclosure status, list of tools with latest scores and badges, disclosure history"
      target_phase: "Phase 1 (May 2026)"

  p2_nice_to_have:
    - id: "F-022"
      name: "Cross-Cycle Anomaly Detection"
      type: "ANALYTICS"
      touched_entities: ["Score", "SynthesisRecord", "BenchmarkCycle"]
      effort: "M (1-3 days)"
      dependencies: ["F-011"]
      description: "Statistical anomaly detection across cycles, automated flagging with configurable sensitivity, anomaly audit reports."
      mvp_simplification: "Basic threshold checks (score deviation from prior cycle, cross-model disagreement flag); full statistical detection deferred to P1"
      target_phase: "Phase 1 (May 2026)"

    - id: "F-023"
      name: "Score Correction Workflow (Post-Publication)"
      type: "WORKFLOW"
      touched_entities: ["ScoreCorrection", "Score", "BenchmarkCycle"]
      effort: "S (<1 day)"
      dependencies: ["F-014"]
      description: "Formal correction workflow for published scores. Creates ScoreCorrection record, preserves original value, requires documented reason, transitions Score to Corrected state. Corrections publicly visible."
      acceptance_criteria:
        - id: "AC-023-01"
          given: "A score has state = Published and an error confirmed"
          when: "Admin applies correction"
          then: "ScoreCorrection record created with previous_value, new_value, reason, corrected_by, approved_by (must differ per BR-S02); Score.value updated, state -> Corrected"
        - id: "AC-023-02"
          given: "A score has been corrected"
          when: "Visitor views tool detail page"
          then: "Corrected score displays with 'Corrected' indicator; clickable for correction history"
      target_phase: "Phase 2 (June 2026)"

tech_stack:
  frontend:
    framework: "Next.js"
    rendering: "SSR/SSG (public pages statically generated where possible)"
    styling: "Tailwind CSS"
    state_management: "Zustand"
    content: "MDX for static pages"
    structured_data: "JSON-LD"
    flexibility: "preferred"
    rationale: "SSR/SSG critical for SEO-heavy benchmark publication pages"

  backend:
    runtime: "Node.js"
    framework: "Next.js API Routes"
    api_style: "REST"
    flexibility: "flexible"
    rationale: "Unified Next.js deployment simplifies solo developer operations"

  database:
    primary: "PostgreSQL"
    provider: "Neon (serverless PostgreSQL)"
    orm: "Prisma"
    cache: "None for v1"
    entity_count: 23
    flexibility: "preferred"
    rationale: "23-entity relational model with complex joins requires PostgreSQL. Prisma for type-safe queries."

  auth:
    provider: "Custom"
    methods: ["email-password"]
    session_expiry: "24 hours"
    lockout: "5 failed attempts"
    password_hashing: "bcrypt"
    flexibility: "flexible"
    rationale: "Admin-only auth for single operator. No OAuth, no social login."

  ai_models:
    providers: ["OpenAI", "Anthropic", "Google", "Cohere", "Mistral", "Meta"]
    target_count: 6
    minimum_for_synthesis: 4
    flexibility: "flexible"
    rationale: "6 distinct AI models for multi-source evaluation synthesis"

  email:
    provider: "Resend"
    alternative: "Buttondown for newsletter"
    volume: "< 100 emails/month"
    flexibility: "flexible"

  infrastructure:
    frontend_hosting: "Vercel"
    backend_hosting: "Vercel"
    database_hosting: "Neon"
    file_storage: "S3 or R2 (cloud storage)"
    ci_cd: "GitHub Actions"
    environments: ["development", "staging", "production"]
    preview_deployments: true
    flexibility: "flexible"

  monitoring:
    error_tracking: "Sentry"
    analytics: "Plausible Analytics (preferred over Google Analytics)"
    logging: "Console (v1)"
    analytics_rationale: "Privacy-respecting, no cookies, lightweight, matches solopreneur operational simplicity"

  testing:
    unit: "Vitest"
    e2e: "Playwright"
    coverage_target: 85
    test_case_count: 60
    rationale: "Vitest for fast unit/integration. Playwright for E2E and security. 85% coverage reflects 60-test-case suite."

  quality:
    linting:
      eslint: true
      prettier: true
      typescript: "strict"
    rationale: "Strict TypeScript catches data model mismatches. Essential for 23-entity system."

  seo:
    structured_data: "JSON-LD"
    sitemap: "Dynamic (regenerated after each publication cycle)"
    schemas: ["Product (tool pages)", "Article (benchmark reports)", "ItemList (leaderboard)"]

data_model:
  entity_count: 23
  entities:
    - name: "BenchmarkCycle"
      description: "A single monthly evaluation cycle with lifecycle states"
      attributes:
        - { name: "id", type: "UUID", constraints: "PK" }
        - { name: "cycle_identifier", type: "String", constraints: "Unique, e.g., '2026-03'" }
        - { name: "state", type: "Enum", constraints: "Draft|Planning|Evaluation|Synthesis|Review|VendorReview|Publication|Completed|Suspended|Cancelled" }
        - { name: "start_date", type: "Date", constraints: "Required" }
        - { name: "end_date", type: "Date", constraints: "Nullable" }
        - { name: "methodology_version_id", type: "UUID", constraints: "FK -> MethodologyVersion" }
        - { name: "published_at", type: "DateTime", constraints: "Nullable, set on Publication transition" }
        - { name: "created_at", type: "DateTime", constraints: "Auto" }
        - { name: "updated_at", type: "DateTime", constraints: "Auto" }
      relationships:
        - "has_many CycleToolEnrollment"
        - "has_one MethodologyVersion"
        - "has_one BenchmarkReport"
        - "has_one CycleAuditPackage"

    - name: "BenchmarkTrackDefinition"
      description: "Defines an evaluation track (e.g., GEO Platform)"
      attributes:
        - { name: "id", type: "UUID", constraints: "PK" }
        - { name: "name", type: "String", constraints: "Required, Unique" }
        - { name: "slug", type: "String", constraints: "Required, Unique, URL-safe" }
        - { name: "description", type: "Text", constraints: "Required" }
        - { name: "is_active", type: "Boolean", constraints: "Default true" }
      relationships:
        - "has_many ToolTrackMapping"
        - "has_many ScoringDimension (via methodology)"

    - name: "Tool"
      description: "A software product being evaluated"
      attributes:
        - { name: "id", type: "UUID", constraints: "PK" }
        - { name: "name", type: "String", constraints: "Required" }
        - { name: "slug", type: "String", constraints: "Required, Unique, URL-safe" }
        - { name: "description", type: "Text", constraints: "Required" }
        - { name: "website_url", type: "String", constraints: "Required" }
        - { name: "logo_url", type: "String", constraints: "Nullable" }
        - { name: "vendor_id", type: "UUID", constraints: "FK -> Vendor" }
        - { name: "is_archived", type: "Boolean", constraints: "Default false (soft delete)" }
        - { name: "created_at", type: "DateTime", constraints: "Auto" }
        - { name: "updated_at", type: "DateTime", constraints: "Auto" }
      relationships:
        - "belongs_to Vendor"
        - "has_many ToolTrackMapping"
        - "has_many ToolSegmentMapping"
        - "has_many CycleToolEnrollment"

    - name: "Vendor"
      description: "A company that produces one or more evaluated tools"
      attributes:
        - { name: "id", type: "UUID", constraints: "PK" }
        - { name: "company_name", type: "String", constraints: "Required" }
        - { name: "website_url", type: "String", constraints: "Required" }
        - { name: "contact_email", type: "String", constraints: "Nullable" }
        - { name: "contact_name", type: "String", constraints: "Nullable" }
        - { name: "logo_url", type: "String", constraints: "Nullable" }
        - { name: "created_at", type: "DateTime", constraints: "Auto" }
        - { name: "updated_at", type: "DateTime", constraints: "Auto" }
      relationships:
        - "has_many Tool"
        - "has_many VendorDisclosure"

    - name: "CycleToolEnrollment"
      description: "Links a tool to a specific benchmark cycle"
      attributes:
        - { name: "id", type: "UUID", constraints: "PK" }
        - { name: "cycle_id", type: "UUID", constraints: "FK -> BenchmarkCycle" }
        - { name: "tool_id", type: "UUID", constraints: "FK -> Tool" }
        - { name: "track_id", type: "UUID", constraints: "FK -> BenchmarkTrackDefinition" }
        - { name: "enrolled_at", type: "DateTime", constraints: "Auto" }
        - { name: "withdrawn_at", type: "DateTime", constraints: "Nullable" }
        - { name: "withdrawal_reason", type: "Text", constraints: "Required if withdrawn_at set" }
      relationships:
        - "belongs_to BenchmarkCycle"
        - "belongs_to Tool"
        - "belongs_to BenchmarkTrackDefinition"

    - name: "ToolTrackMapping"
      description: "Maps a tool to a benchmark track"
      attributes:
        - { name: "id", type: "UUID", constraints: "PK" }
        - { name: "tool_id", type: "UUID", constraints: "FK -> Tool" }
        - { name: "track_id", type: "UUID", constraints: "FK -> BenchmarkTrackDefinition" }
      relationships:
        - "belongs_to Tool"
        - "belongs_to BenchmarkTrackDefinition"

    - name: "ToolSegmentMapping"
      description: "Maps a tool to a market segment"
      attributes:
        - { name: "id", type: "UUID", constraints: "PK" }
        - { name: "tool_id", type: "UUID", constraints: "FK -> Tool" }
        - { name: "segment_id", type: "UUID", constraints: "FK -> MarketSegment" }
      relationships:
        - "belongs_to Tool"
        - "belongs_to MarketSegment"

    - name: "MarketSegment"
      description: "A market category for grouping tools (e.g., Enterprise SEO)"
      attributes:
        - { name: "id", type: "UUID", constraints: "PK" }
        - { name: "name", type: "String", constraints: "Required, Unique" }
        - { name: "slug", type: "String", constraints: "Required, Unique" }
        - { name: "description", type: "Text", constraints: "Nullable" }
      relationships:
        - "has_many ToolSegmentMapping"

    - name: "MethodologyVersion"
      description: "A versioned methodology definition locked to cycles"
      attributes:
        - { name: "id", type: "UUID", constraints: "PK" }
        - { name: "version_number", type: "String", constraints: "Required, Unique, semver" }
        - { name: "effective_date", type: "Date", constraints: "Required" }
        - { name: "description", type: "Text", constraints: "Required" }
        - { name: "is_locked", type: "Boolean", constraints: "Default false; true when cycle transitions from Draft" }
        - { name: "created_at", type: "DateTime", constraints: "Auto" }
      relationships:
        - "has_many ScoringDimension"
        - "has_many PromptSet"
        - "has_many BenchmarkCycle"

    - name: "ScoringDimension"
      description: "An individual evaluation criterion with weight"
      attributes:
        - { name: "id", type: "UUID", constraints: "PK" }
        - { name: "name", type: "String", constraints: "Required" }
        - { name: "description", type: "Text", constraints: "Required" }
        - { name: "weight", type: "Decimal", constraints: "Required, 0-1, all weights sum to 1.0 within a track" }
        - { name: "category", type: "String", constraints: "Required (grouping for display)" }
        - { name: "methodology_version_id", type: "UUID", constraints: "FK -> MethodologyVersion" }
        - { name: "track_id", type: "UUID", constraints: "FK -> BenchmarkTrackDefinition" }
      relationships:
        - "belongs_to MethodologyVersion"
        - "belongs_to BenchmarkTrackDefinition"
        - "has_many Score"
        - "has_many PromptSet"

    - name: "AIModel"
      description: "Configuration for an AI model used in evaluations"
      attributes:
        - { name: "id", type: "UUID", constraints: "PK" }
        - { name: "provider", type: "String", constraints: "Required (openai, anthropic, google, cohere, mistral, meta)" }
        - { name: "model_identifier", type: "String", constraints: "Required" }
        - { name: "api_config", type: "JSON", constraints: "Required (encrypted)" }
        - { name: "timeout_ms", type: "Integer", constraints: "Required" }
        - { name: "is_active", type: "Boolean", constraints: "Default true" }
        - { name: "created_at", type: "DateTime", constraints: "Auto" }
      relationships:
        - "has_many ModelEvaluation"

    - name: "PromptSet"
      description: "A collection of prompts for evaluating tools against dimensions"
      attributes:
        - { name: "id", type: "UUID", constraints: "PK" }
        - { name: "name", type: "String", constraints: "Required" }
        - { name: "methodology_version_id", type: "UUID", constraints: "FK -> MethodologyVersion" }
        - { name: "dimension_id", type: "UUID", constraints: "FK -> ScoringDimension" }
        - { name: "prompts", type: "JSON", constraints: "Required (array of prompt strings)" }
        - { name: "is_rotating", type: "Boolean", constraints: "Default false (70% stable, 30% rotating)" }
        - { name: "created_at", type: "DateTime", constraints: "Auto" }
      relationships:
        - "belongs_to MethodologyVersion"
        - "belongs_to ScoringDimension"

    - name: "ModelEvaluation"
      description: "A single AI model's evaluation of a tool on a dimension"
      attributes:
        - { name: "id", type: "UUID", constraints: "PK" }
        - { name: "cycle_id", type: "UUID", constraints: "FK -> BenchmarkCycle" }
        - { name: "tool_id", type: "UUID", constraints: "FK -> Tool" }
        - { name: "dimension_id", type: "UUID", constraints: "FK -> ScoringDimension" }
        - { name: "model_id", type: "UUID", constraints: "FK -> AIModel" }
        - { name: "prompt_set_id", type: "UUID", constraints: "FK -> PromptSet" }
        - { name: "raw_response", type: "Text", constraints: "Required" }
        - { name: "parsed_score", type: "Decimal", constraints: "Nullable (0-10)" }
        - { name: "response_time_ms", type: "Integer", constraints: "Required" }
        - { name: "status", type: "Enum", constraints: "Success|Failed|Timeout" }
        - { name: "retry_count", type: "Integer", constraints: "Default 0" }
        - { name: "evaluated_at", type: "DateTime", constraints: "Required" }
      relationships:
        - "belongs_to BenchmarkCycle"
        - "belongs_to Tool"
        - "belongs_to ScoringDimension"
        - "belongs_to AIModel"
        - "belongs_to PromptSet"
        - "has_many EvidenceArtifact"

    - name: "SynthesisRecord"
      description: "Record of the synthesis process aggregating model evaluations into a score"
      attributes:
        - { name: "id", type: "UUID", constraints: "PK" }
        - { name: "score_id", type: "UUID", constraints: "FK -> Score" }
        - { name: "model_evaluations_used", type: "JSON", constraints: "Required (array of ModelEvaluation IDs)" }
        - { name: "models_succeeded", type: "Integer", constraints: "Required" }
        - { name: "models_failed", type: "Integer", constraints: "Required" }
        - { name: "median_value", type: "Decimal", constraints: "Required" }
        - { name: "agreement_metric", type: "Decimal", constraints: "Required (inter-model agreement)" }
        - { name: "confidence_derivation", type: "JSON", constraints: "Required (explains confidence tag assignment)" }
        - { name: "synthesized_at", type: "DateTime", constraints: "Required" }
      relationships:
        - "belongs_to Score"

    - name: "Score"
      description: "A synthesized score for a tool on a dimension within a cycle"
      attributes:
        - { name: "id", type: "UUID", constraints: "PK" }
        - { name: "cycle_id", type: "UUID", constraints: "FK -> BenchmarkCycle" }
        - { name: "tool_id", type: "UUID", constraints: "FK -> Tool" }
        - { name: "dimension_id", type: "UUID", constraints: "FK -> ScoringDimension" }
        - { name: "value", type: "Decimal", constraints: "Required, 0-10, one decimal place" }
        - { name: "confidence_tag", type: "Enum", constraints: "High|Medium|Low|Insufficient Data" }
        - { name: "is_applicable", type: "Boolean", constraints: "Default true" }
        - { name: "state", type: "Enum", constraints: "Draft|Reviewed|Published|Corrected" }
        - { name: "reviewed_by", type: "String", constraints: "Nullable" }
        - { name: "reviewed_at", type: "DateTime", constraints: "Nullable" }
        - { name: "created_at", type: "DateTime", constraints: "Auto" }
        - { name: "updated_at", type: "DateTime", constraints: "Auto" }
      relationships:
        - "belongs_to BenchmarkCycle"
        - "belongs_to Tool"
        - "belongs_to ScoringDimension"
        - "has_one SynthesisRecord"
        - "has_many ScoreCorrection"

    - name: "ScoreCorrection"
      description: "A post-publication correction to a score"
      attributes:
        - { name: "id", type: "UUID", constraints: "PK" }
        - { name: "score_id", type: "UUID", constraints: "FK -> Score" }
        - { name: "previous_value", type: "Decimal", constraints: "Required" }
        - { name: "new_value", type: "Decimal", constraints: "Required" }
        - { name: "reason", type: "Text", constraints: "Required" }
        - { name: "corrected_by", type: "String", constraints: "Required" }
        - { name: "approved_by", type: "String", constraints: "Required (must differ from corrected_by per BR-S02)" }
        - { name: "corrected_at", type: "DateTime", constraints: "Required" }
      relationships:
        - "belongs_to Score"

    - name: "CompositeScore"
      description: "Weighted composite of dimension scores for a tool in a cycle"
      attributes:
        - { name: "id", type: "UUID", constraints: "PK" }
        - { name: "cycle_id", type: "UUID", constraints: "FK -> BenchmarkCycle" }
        - { name: "tool_id", type: "UUID", constraints: "FK -> Tool" }
        - { name: "track_id", type: "UUID", constraints: "FK -> BenchmarkTrackDefinition" }
        - { name: "value", type: "Decimal", constraints: "Required, 0-10, one decimal place" }
        - { name: "rank", type: "Integer", constraints: "Required, dense ranking" }
        - { name: "weight_breakdown", type: "JSON", constraints: "Required (dimension weights used, including renormalization)" }
        - { name: "calculated_at", type: "DateTime", constraints: "Required" }
      relationships:
        - "belongs_to BenchmarkCycle"
        - "belongs_to Tool"
        - "belongs_to BenchmarkTrackDefinition"

    - name: "Badge"
      description: "Awards given to top-performing tools"
      attributes:
        - { name: "id", type: "UUID", constraints: "PK" }
        - { name: "cycle_id", type: "UUID", constraints: "FK -> BenchmarkCycle" }
        - { name: "tool_id", type: "UUID", constraints: "FK -> Tool" }
        - { name: "badge_type", type: "String", constraints: "Required" }
        - { name: "category", type: "String", constraints: "Required" }
        - { name: "awarded_at", type: "DateTime", constraints: "Required" }
      relationships:
        - "belongs_to BenchmarkCycle"
        - "belongs_to Tool"

    - name: "EvidenceArtifact"
      description: "Evidence backing an evaluation score"
      attributes:
        - { name: "id", type: "UUID", constraints: "PK" }
        - { name: "evaluation_id", type: "UUID", constraints: "FK -> ModelEvaluation" }
        - { name: "artifact_type", type: "Enum", constraints: "Screenshot|URL|Document|Video" }
        - { name: "file_url", type: "String", constraints: "Required (cloud storage URL)" }
        - { name: "description", type: "Text", constraints: "Nullable" }
        - { name: "captured_at", type: "DateTime", constraints: "Required" }
      relationships:
        - "belongs_to ModelEvaluation"

    - name: "BenchmarkReport"
      description: "Published monthly benchmark report"
      attributes:
        - { name: "id", type: "UUID", constraints: "PK" }
        - { name: "cycle_id", type: "UUID", constraints: "FK -> BenchmarkCycle, Unique" }
        - { name: "title", type: "String", constraints: "Required" }
        - { name: "content", type: "JSON/Text", constraints: "Required (narrative + data sections)" }
        - { name: "published_at", type: "DateTime", constraints: "Nullable" }
        - { name: "created_at", type: "DateTime", constraints: "Auto" }
      relationships:
        - "belongs_to BenchmarkCycle"

    - name: "CycleAuditPackage"
      description: "Sealed audit package for transparency and reproducibility"
      attributes:
        - { name: "id", type: "UUID", constraints: "PK" }
        - { name: "cycle_id", type: "UUID", constraints: "FK -> BenchmarkCycle, Unique" }
        - { name: "package_data", type: "JSON", constraints: "Required (all evaluation data)" }
        - { name: "sha256_hash", type: "String", constraints: "Required, computed on seal" }
        - { name: "sealed_at", type: "DateTime", constraints: "Required" }
        - { name: "is_sealed", type: "Boolean", constraints: "Default false; true after sealing" }
      relationships:
        - "belongs_to BenchmarkCycle"

    - name: "VendorDisclosure"
      description: "Vendor-submitted disclosure for transparency"
      attributes:
        - { name: "id", type: "UUID", constraints: "PK" }
        - { name: "vendor_id", type: "UUID", constraints: "FK -> Vendor" }
        - { name: "cycle_id", type: "UUID", constraints: "FK -> BenchmarkCycle" }
        - { name: "status", type: "Enum", constraints: "Requested|Submitted|Reviewed|Incorporated|Expired" }
        - { name: "submitted_at", type: "DateTime", constraints: "Nullable" }
        - { name: "content", type: "JSON/Text", constraints: "Nullable" }
        - { name: "created_at", type: "DateTime", constraints: "Auto" }
      relationships:
        - "belongs_to Vendor"
        - "belongs_to BenchmarkCycle"

    - name: "VendorReview"
      description: "Pre-publication vendor review of their scores"
      attributes:
        - { name: "id", type: "UUID", constraints: "PK" }
        - { name: "cycle_id", type: "UUID", constraints: "FK -> BenchmarkCycle" }
        - { name: "vendor_id", type: "UUID", constraints: "FK -> Vendor" }
        - { name: "window_opens_at", type: "DateTime", constraints: "Required" }
        - { name: "window_closes_at", type: "DateTime", constraints: "Required (5 business days)" }
        - { name: "status", type: "Enum", constraints: "Pending|InReview|Completed|Expired" }
        - { name: "corrections_submitted", type: "JSON", constraints: "Nullable" }
      relationships:
        - "belongs_to BenchmarkCycle"
        - "belongs_to Vendor"

    - name: "ContentBlock"
      description: "Managed content blocks for static pages"
      attributes:
        - { name: "id", type: "UUID", constraints: "PK" }
        - { name: "page_slug", type: "String", constraints: "Required" }
        - { name: "content", type: "Text/MDX", constraints: "Required" }
        - { name: "updated_at", type: "DateTime", constraints: "Auto" }

state_machines:
  benchmark_cycle:
    entity: "BenchmarkCycle"
    states:
      - name: "Draft"
        description: "Initial state; cycle configuration in progress"
      - name: "Planning"
        description: "Methodology locked; tools being enrolled"
      - name: "Evaluation"
        description: "AI model evaluations in progress"
      - name: "Synthesis"
        description: "Raw evaluations being synthesized into scores"
      - name: "Review"
        description: "Operator reviewing synthesized scores"
      - name: "VendorReview"
        description: "Pre-publication vendor review window (5 business days)"
      - name: "Publication"
        description: "Benchmark being published to public site"
      - name: "Completed"
        description: "Terminal state; cycle fully published"
      - name: "Suspended"
        description: "Cycle paused (non-terminal)"
      - name: "Cancelled"
        description: "Terminal state; cycle abandoned"
    state_count: 10
    transition_count: 14
    transitions:
      - { from: "Draft", to: "Planning", trigger: "Admin locks methodology and begins enrollment", guard: "Valid methodology version exists" }
      - { from: "Planning", to: "Evaluation", trigger: "Admin initiates evaluation", guard: ">= 5 enrolled tools per track (BR-T03)" }
      - { from: "Evaluation", to: "Synthesis", trigger: "All scheduled evaluations complete or timed out", guard: "Sufficient model responses per tool" }
      - { from: "Synthesis", to: "Review", trigger: "Synthesis pipeline completes", guard: "All dimension scores synthesized" }
      - { from: "Review", to: "VendorReview", trigger: "Operator approves all scores", guard: "All scores in Reviewed state" }
      - { from: "VendorReview", to: "Publication", trigger: "Vendor review window closes", guard: "5 business days elapsed; audit package sealed (BR-AUD02)" }
      - { from: "Publication", to: "Completed", trigger: "Publication confirmed live", guard: "All public pages updated" }
      - { from: "Draft", to: "Cancelled", trigger: "Admin cancels", guard: "None" }
      - { from: "Planning", to: "Cancelled", trigger: "Admin cancels", guard: "None" }
      - { from: "Draft", to: "Suspended", trigger: "Admin suspends", guard: "None" }
      - { from: "Planning", to: "Suspended", trigger: "Admin suspends", guard: "None" }
      - { from: "Evaluation", to: "Suspended", trigger: "Admin suspends", guard: "None" }
      - { from: "Suspended", to: "Draft", trigger: "Admin resumes", guard: "None" }
      - { from: "Suspended", to: "Cancelled", trigger: "Admin cancels suspended cycle", guard: "None" }
    invalid_transitions:
      - "Draft directly to Evaluation (must go through Planning)"
      - "Completed to any state (terminal)"
      - "Cancelled to any state (terminal)"
      - "Publication back to Review (no rollback after vendor review)"
    side_effects:
      Draft_to_Planning: "Methodology version becomes immutable for this cycle"
      Planning_to_Evaluation: "Enrolled tools locked; no new enrollments"
      VendorReview_to_Publication: "Scores transition to Published state"
      Publication_to_Completed: "Public pages updated; composite scores finalized"

  score:
    entity: "Score"
    states:
      - name: "Draft"
        description: "Score synthesized but not yet reviewed"
      - name: "Reviewed"
        description: "Operator has reviewed and approved the score"
      - name: "Published"
        description: "Score is publicly visible"
      - name: "Corrected"
        description: "Published score has been corrected post-publication"
    state_count: 4
    transition_count: 5
    transitions:
      - { from: "Draft", to: "Reviewed", trigger: "Operator approves score", guard: "Evidence artifacts exist for is_applicable scores (BR-S06)" }
      - { from: "Draft", to: "Draft", trigger: "Operator requests re-synthesis", guard: "None" }
      - { from: "Reviewed", to: "Published", trigger: "Cycle transitions to Publication", guard: "Cycle audit package sealed" }
      - { from: "Published", to: "Corrected", trigger: "Admin applies correction", guard: "ScoreCorrection record with different corrected_by and approved_by (BR-S02)" }
      - { from: "Corrected", to: "Corrected", trigger: "Additional correction applied", guard: "New ScoreCorrection record" }
    side_effects:
      Draft_to_Reviewed: "Audit trail records reviewer, timestamp, any adjustments"
      Published_to_Corrected: "Composite scores recalculated; rankings updated; public indicator shown"

business_rules:
  scoring_rules:
    - id: "BR-S01"
      category: "Scoring"
      statement: "All published scores must use a 0-10 scale with one decimal place precision"
      enforcement: "Database constraint and application validation"
      exceptions: "None"

    - id: "BR-S02"
      category: "Scoring"
      statement: "Score corrections require corrected_by and approved_by to differ (dual approval)"
      enforcement: "Application validation on ScoreCorrection creation"
      exceptions: "Solopreneur clause: operator uses two distinct identifiers (e.g., 'operator' and 'editor') to maintain audit trail convention"

    - id: "BR-S03"
      category: "Scoring"
      statement: "Scores with is_applicable = false are excluded from composite score calculation"
      enforcement: "Composite score calculation logic"
      exceptions: "None"

    - id: "BR-S04"
      category: "Scoring"
      statement: "Composite scores use weighted average with renormalized weights when dimensions are N/A"
      enforcement: "CompositeScore calculation function"
      exceptions: "None"

    - id: "BR-S05"
      category: "Scoring"
      statement: "Composite scores are rounded to one decimal place"
      enforcement: "Calculation function"
      exceptions: "None; rounding method: round half up (standard mathematical rounding)"

    - id: "BR-S06"
      category: "Scoring"
      statement: "Every score with is_applicable = true must be backed by at least one evidence artifact"
      enforcement: "Transition guard on Score Draft -> Reviewed"
      exceptions: "None"

    - id: "BR-S07"
      category: "Scoring"
      statement: "Synthesis requires a minimum of 4 successful model evaluations out of 6"
      enforcement: "Synthesis pipeline validation"
      exceptions: "If fewer than 4 models succeed, confidence_tag = 'Insufficient Data'"

    - id: "BR-S08"
      category: "Scoring"
      statement: "Rankings use dense ranking (tied scores receive the same rank)"
      enforcement: "Ranking calculation function"
      exceptions: "None"

    - id: "BR-S09"
      category: "Scoring"
      statement: "Score synthesis uses median-based aggregation from model evaluations"
      enforcement: "Synthesis pipeline"
      exceptions: "None"

    - id: "BR-S10"
      category: "Scoring"
      statement: "Confidence tags are derived from inter-model agreement metrics"
      enforcement: "Synthesis pipeline"
      exceptions: "None"

    - id: "BR-S11"
      category: "Scoring"
      statement: "Model failures must not block synthesis if >= 4 models succeed"
      enforcement: "Synthesis pipeline; graceful degradation"
      exceptions: "None"

    - id: "BR-S12"
      category: "Scoring"
      statement: "Synthesis must be deterministic (identical inputs produce identical outputs)"
      enforcement: "Synthesis function design; regression testing (T-053)"
      exceptions: "None"

    - id: "BR-S13"
      category: "Scoring"
      statement: "AI Search Mastery products scored with identical methodology; never omitted or footnoted differently"
      enforcement: "Operational policy; audit package verification"
      exceptions: "None"

    - id: "BR-S14"
      category: "Scoring"
      statement: "No automated publishing without operator approval (human review gate)"
      enforcement: "Score state machine; Review state is mandatory"
      exceptions: "None"

    - id: "BR-S15"
      category: "Scoring"
      statement: "Score correction cascades must trigger automatic composite recalculation and ranking update"
      enforcement: "Application logic on ScoreCorrection creation"
      exceptions: "None"

  vendor_rules:
    - id: "BR-V01"
      category: "Vendor"
      statement: "Every vendor's disclosure status must be prominently displayed wherever their tool's scores appear (full/partial/none)"
      enforcement: "UI rendering; never omit disclosure status"
      exceptions: "None"

    - id: "BR-V02"
      category: "Vendor"
      statement: "Vendor pre-publication review window is exactly 5 business days"
      enforcement: "Timer on VendorReview state"
      exceptions: "None"

    - id: "BR-V03"
      category: "Vendor"
      statement: "Vendor corrections are limited to factual accuracy claims with supporting evidence"
      enforcement: "Correction submission form; operator review"
      exceptions: "None"

    - id: "BR-V04"
      category: "Vendor"
      statement: "Vendor-facing outputs contain only that vendor's own tool data (strict data isolation)"
      enforcement: "API/UI access controls; IDOR prevention"
      exceptions: "None"

    - id: "BR-V05"
      category: "Vendor"
      statement: "Benchmark functions without vendor participation; scores based on independent evaluation"
      enforcement: "Architecture design; no vendor-supplied data in scoring"
      exceptions: "None"

  track_rules:
    - id: "BR-T01"
      category: "Track"
      statement: "Only one active (non-terminal) benchmark cycle at a time"
      enforcement: "Application validation on cycle creation"
      exceptions: "None"

    - id: "BR-T02"
      category: "Track"
      statement: "Withdrawn tools are excluded from composite score rankings and badges"
      enforcement: "Ranking calculation; badge awarding"
      exceptions: "Evaluation data is preserved for audit"

    - id: "BR-T03"
      category: "Track"
      statement: "Minimum 5 enrolled tools per track to proceed from Planning to Evaluation"
      enforcement: "State transition guard"
      exceptions: "Track deferred if below minimum"

  synthesis_rules:
    - id: "BR-SYN01"
      category: "Synthesis"
      statement: "Prompt sets follow 70/30 rotation: 70% stable prompts, 30% rotating each cycle"
      enforcement: "Prompt management logic"
      exceptions: "Rotation cadence: replace 30% sequentially each cycle"

    - id: "BR-SYN02"
      category: "Synthesis"
      statement: "Methodology version is locked when cycle transitions from Draft to Planning"
      enforcement: "State transition side effect; immutability constraint"
      exceptions: "None"

  audit_rules:
    - id: "BR-AUD01"
      category: "Audit"
      statement: "Audit package must be sealed before publication"
      enforcement: "State transition guard on VendorReview -> Publication"
      exceptions: "None"

    - id: "BR-AUD02"
      category: "Audit"
      statement: "Sealed audit packages cannot be modified (immutable)"
      enforcement: "Application-level write protection; SHA-256 tamper detection"
      exceptions: "None"

