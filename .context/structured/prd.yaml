glossary:
  - term: "BenchmarkCycle"
    definition: "A single monthly evaluation period with a defined start date, methodology version, and set of enrolled tools. Progresses through a state machine from Draft to Completed."

  - term: "BenchmarkTrackDefinition"
    definition: "A category of evaluation (e.g., GEO Platform, llms.txt). Each track has its own set of scoring dimensions, weights, and enrolled tools."

  - term: "Tool"
    definition: "A software product being evaluated in the benchmark. Belongs to a Vendor and is mapped to one or more tracks and market segments."

  - term: "Vendor"
    definition: "A company that produces one or more tools being evaluated. Has a disclosure relationship with the benchmark."

  - term: "CycleToolEnrollment"
    definition: "The association between a Tool and a BenchmarkCycle, including the specific track and enrollment/withdrawal status."

  - term: "ToolTrackMapping"
    definition: "The persistent assignment of a tool to a benchmark track (separate from per-cycle enrollment)."

  - term: "ToolSegmentMapping"
    definition: "The assignment of a tool to a market segment for filtering purposes."

  - term: "MarketSegment"
    definition: "A market category for grouping tools (e.g., Enterprise SEO, Content Optimization, Technical SEO)."

  - term: "MethodologyVersion"
    definition: "A versioned snapshot of the evaluation methodology including scoring dimensions, weights, and criteria. Locked to a cycle once it transitions from Draft."

  - term: "ScoringDimension"
    definition: "An individual evaluation criterion within a methodology version. Has a weight that contributes to the composite score."

  - term: "AIModel"
    definition: "A configured AI language model used in the evaluation process. Six models are used per evaluation for multi-source consensus."

  - term: "PromptSet"
    definition: "A collection of prompts linked to a scoring dimension and methodology version. Follows 70/30 rotation policy (70% stable, 30% rotating each cycle)."

  - term: "ModelEvaluation"
    definition: "A single AI model's evaluation of a specific tool on a specific dimension using a specific prompt set. The atomic unit of raw evaluation data."

  - term: "SynthesisRecord"
    definition: "The record of how multiple ModelEvaluations were aggregated into a single Score, including the median calculation, model agreement metrics, and confidence derivation."

  - term: "Score"
    definition: "A synthesized, 0-10 score for a tool on a dimension within a cycle. Has a state machine (Draft, Reviewed, Published, Corrected) and a confidence tag."

  - term: "ScoreCorrection"
    definition: "A post-publication correction to a Score, preserving the original value and requiring dual approval (corrected_by != approved_by)."

  - term: "CompositeScore"
    definition: "A weighted average of dimension scores for a tool within a track and cycle. Uses dense ranking. Handles N/A dimensions via weight renormalization."

  - term: "Badge"
    definition: "An award given to top-performing tools in a benchmark cycle (e.g., Top Performer, Category Leader). Embeddable and verifiable."

  - term: "EvidenceArtifact"
    definition: "A supporting artifact (screenshot, URL, document, video) linked to a ModelEvaluation that substantiates the evaluation."

  - term: "BenchmarkReport"
    definition: "The published monthly benchmark report containing narrative analysis, data tables, and ranking summaries for a cycle."

  - term: "CycleAuditPackage"
    definition: "A sealed, immutable package containing complete evaluation data for a cycle. Includes SHA-256 hash for tamper detection. Required before publication."

  - term: "VendorDisclosure"
    definition: "A vendor's submitted disclosure containing factual information about their company and tools. Status tracked as Requested/Submitted/Reviewed/Incorporated/Expired."

  - term: "VendorReview"
    definition: "The pre-publication window where vendors can review their own tool's scores and submit factual corrections. Duration: 5 business days."

  - term: "Dense Ranking"
    definition: "A ranking method where tied items receive the same rank and the next rank is consecutive (1, 2, 2, 3 instead of 1, 2, 2, 4)."

  - term: "GEO"
    definition: "Generative Engine Optimization. The practice of optimizing content and websites for AI-powered search engines."

  - term: "AEO"
    definition: "Answer Engine Optimization. Overlapping discipline with GEO focused on optimizing for AI answer engines."

  - term: "ContentBlock"
    definition: "A managed content element for static pages, stored as MDX for rich content with embedded components."

non_functional_requirements:
  performance:
    - requirement: "Core Web Vitals compliance on all public pages"
      target: "LCP < 2.5s, FID < 100ms, CLS < 0.1"
    - requirement: "Public page load time"
      target: "< 3 seconds on 3G connection"
    - requirement: "Statically generated public pages where possible (SSG)"
    - requirement: "Image optimization for tool logos and evidence artifacts"
    - requirement: "Caching strategy for published benchmark data"

  security:
    - requirement: "Admin authentication on all /admin/* routes"
    - requirement: "CSRF protection on all state-changing endpoints"
      detail: "10 admin endpoints protected (T-055)"
    - requirement: "Brute-force protection"
      detail: "Account lockout after 5 failed attempts"
    - requirement: "Session expiry after 24 hours"
    - requirement: "SQL injection prevention via parameterized queries (Prisma ORM)"
    - requirement: "XSS prevention via output escaping"
    - requirement: "IDOR prevention on vendor data isolation"
    - requirement: "API key encryption at rest"
    - requirement: "HTTPS enforcement"
    - requirement: "Password hashing with bcrypt"

  accessibility:
    - requirement: "Leaderboard and tool detail pages must be screen-reader compatible"
    - requirement: "Color-coded elements must have non-color alternatives"
    - requirement: "Proper heading hierarchy and semantic HTML"

  scalability:
    - requirement: "Support 27+ tools per evaluation cycle"
    - requirement: "Support 6 AI model providers concurrently"
    - requirement: "Handle monthly publication cycles without performance degradation"
    - requirement: "Database designed for growth (23 entities with proper indexing)"

  data_integrity:
    - requirement: "Deterministic synthesis (identical inputs -> identical outputs)"
    - requirement: "Audit package immutability with SHA-256 tamper detection"
    - requirement: "All score changes tracked with full audit trail"
    - requirement: "No data deletion (soft delete only for tools; evidence artifacts never deleted)"

