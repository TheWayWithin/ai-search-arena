    - id: "F-005"
      name: "Benchmark Cycle Lifecycle Management"
      type: "WORKFLOW"
      touched_entities: ["BenchmarkCycle", "CycleToolEnrollment", "MethodologyVersion", "PromptSet", "BenchmarkReport", "CycleAuditPackage"]
      effort: "XL (5+ days)"
      dependencies: []
      description: "Admin workflow for managing the complete lifecycle of a monthly benchmark cycle through its state machine (Draft -> Planning -> Evaluation -> Synthesis -> Review -> VendorReview -> Publication -> Completed). Enforces business rules for state transitions, prevents concurrent active cycles, and locks methodology version at cycle start."
      user_story: "As the benchmark operator, I want to manage each monthly benchmark cycle through a structured workflow so that every evaluation follows the same rigorous process and no steps are skipped."
      acceptance_criteria:
        - id: "AC-005-01"
          given: "No non-terminal cycle exists"
          when: "The admin creates a new benchmark cycle"
          then: "A BenchmarkCycle record is created in Draft state with cycle_identifier, start_date, and methodology_version_id"
        - id: "AC-005-02"
          given: "A cycle is in Draft state with a valid methodology version locked"
          when: "The admin transitions to Planning"
          then: "The cycle moves to Planning; the methodology version becomes immutable for this cycle"
        - id: "AC-005-03"
          given: "A cycle is in Planning state with >= 5 enrolled tools per track (BR-T03)"
          when: "The admin transitions to Evaluation"
          then: "The cycle moves to Evaluation; enrolled tools are locked; no new enrollments or withdrawals"
        - id: "AC-005-04"
          given: "A non-terminal cycle already exists"
          when: "The admin attempts to create another cycle"
          then: "The action is rejected with error: only one active cycle is allowed at a time"
        - id: "AC-005-05"
          given: "A cycle is in any state"
          when: "The admin attempts an invalid state transition (e.g., Draft directly to Evaluation)"
          then: "The transition is rejected; the cycle remains in its current state"
      mvp_rationale: "Foundational workflow; every other admin feature depends on the cycle state machine"

