      description: "Core evaluation engine that dispatches prompts to 6 AI models for each tool-dimension pair, captures responses, handles retries with exponential backoff, and stores raw evaluation results. Includes configurable retry logic, timeout handling, and graceful degradation when models are unavailable."
      acceptance_criteria:
        - id: "AC-007-01"
          given: "A cycle is in Evaluation state with enrolled tools and active prompt sets"
