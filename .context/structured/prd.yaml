      effort: "M (1-3 days)"
      dependencies: ["F-011"]
      description: "Calculates weighted composite scores from dimension scores and produces rankings within tracks. Handles N/A dimensions via weight renormalization. Uses dense ranking. Supports human review (approve/adjust/flag workflow) with audit trail."
